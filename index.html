        };

        // --- Helper function for formatting time ---
        const formatTime = (totalSeconds) => {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        };

        /**
         * CardDisplay Component
         * Renders a single poker card with its rank and suit symbol.
         * Handles different sizes and invalid card strings.
         * @param {object} props - Component props.
         * @param {string} props.cardString - The string representation of the card (e.e.g., "AS" for Ace of Spades, "10H" for 10 of Hearts).
         * @param {boolean} [props.isLarge=false] - If true, renders the card in a larger size.
         */
        const CardDisplay = ({ cardString, isLarge = false }) => {
            const [imgFailed, setImgFailed] = useState(false);

            // Validate the input card string length
            if (!cardString || cardString.length < 2 || cardString.length > 3) {
                return <span className="text-red-500">Invalid Card</span>;
            }

            // Extract rank and suit from the card string
            const rank = cardString.slice(0, -1).toUpperCase();
            const suitChar = cardString.slice(-1).toUpperCase();
            const validSuits = ['S', 'H', 'D', 'C'];

            if (!validSuits.includes(suitChar) || !rank) {
                return <span className="text-red-500">Invalid Card</span>;
            }

            const displayRank = (rank === 'T' || rank === '10') ? '10' : rank;
            // deckofcardsapi.com uses "0" for Ten instead of "T"/"10".
            const apiRank = (rank === 'T' || rank === '10') ? '0' : rank;
            const imgSrc = `https://deckofcardsapi.com/static/img/${apiRank}${suitChar}.png`;

            const sizeClasses = isLarge
                ? 'w-[64px] h-[90px] sm:w-[76px] sm:h-[106px]'
                : 'w-[42px] h-[59px]';

            if (imgFailed) {
                // Fallback to a simple text-based card if the real card image can't
                // load (e.g. no internet at the venue) -- still fully functional,
                // just less fancy.
                let suitSymbol, textColorClass;
                switch (suitChar) {
                    case 'S': suitSymbol = '♠'; textColorClass = 'text-gray-900'; break;
                    case 'H': suitSymbol = '♥'; textColorClass = 'text-red-500'; break;
                    case 'D': suitSymbol = '♦'; textColorClass = 'text-red-500'; break;
                    case 'C': suitSymbol = '♣'; textColorClass = 'text-gray-900'; break;
                }
                return (
                    <span className={`inline-flex flex-col items-center justify-center bg-white rounded-md shadow-lg my-0.5 border border-gray-300 ${textColorClass} flex-shrink-0 ${sizeClasses} font-bold`}>
                        <span className={isLarge ? 'text-2xl' : 'text-base'}>{displayRank}</span>
                        <span className={isLarge ? 'text-xl' : 'text-lg'}>{suitSymbol}</span>
                    </span>
                );
            }

            return (
                <img
                    src={imgSrc}
                    alt={`${displayRank} of ${suitChar}`}
                    className={`${sizeClasses} rounded-md shadow-lg my-0.5 flex-shrink-0 object-contain bg-white`}
                    onError={() => setImgFailed(true)}
                />
            );
        };

        /**
         * HandDisplay Component
         * Renders a collection of poker cards (a hand).
         * Takes a space-separated string of cards and renders them using CardDisplay.
         * @param {object} props - Component props.
         * @param {string} props.handString - A space-separated string of cards (e.g., "AS KD 7C 2H 10S").
         * @param {boolean} [props.isLarge=false] - Passed directly to CardDisplay for individual card sizing.
         */
        const HandDisplay = ({ handString, isLarge = false }) => {
            // Return empty fragment if handString is invalid or empty
            if (!handString || typeof handString !== 'string') return <></>;

            // Regex to validate individual card tokens (e.g., "AS", "10H")
            const validCardRegex = /^([2-9]|10|[TJQKA])[shdcSHDC]$/i;
            // Split the hand string into individual card tokens, filter out invalid ones, and uppercase them
            const cardStrings = handString
                .split(' ') // Split by space
                .filter(token => token.trim() !== '' && validCardRegex.test(token.trim())) // Filter valid and non-empty tokens
                .map(token => token.trim().toUpperCase()); // Trim and uppercase each valid token

            return (
                <div className="flex flex-nowrap justify-center sm:justify-start items-center gap-2 overflow-x-auto min-w-max">
                    {/* Map over valid card strings and render CardDisplay for each */}
                    {cardStrings.map((card, index) => (
                        <CardDisplay key={card + index} cardString={card} isLarge={isLarge} />
                    ))}
                </div>
            );
        };

        /**
         * NumberSpinner Component
         * A reusable component for incrementing/decrementing a numeric value.
         * Used for setting timer duration, logo height, and logo offset.
         * @param {object} props - Component props.
         * @param {number} props.value - The current numeric value.
         * @param {number} props.min - The minimum allowed value.
         * @param {number} props.max - The maximum allowed value.
         * @param {number} props.step - The amount to increment/decrement by.
         * @param {function} props.onChange - Callback function when the value changes.
         * @param {string} props.theme - Current theme ('light' or 'dark') for styling.
         * @param {string} [props.widthClass='w-24'] - Tailwind class for width (e.e.g., 'w-24', 'w-32').
         * @param {string} [props.textSizeClass='text-xl'] - Tailwind class for text size (e.e.g., 'text-xl', 'text-lg').
         */
        const NumberSpinner = ({ value, min, max, step, onChange, theme, widthClass = 'w-24', textSizeClass = 'text-xl' }) => {
            // Function to increment the value, respecting the max limit
            const increment = () => onChange(Math.min(value + step, max));
            // Function to decrement the value, respecting the min limit
            const decrement = () => onChange(Math.max(value - step, min));

            // Tailwind CSS classes based on current theme for input and buttons
            const inputBgClass = theme === 'dark' ? 'bg-gray-700' : 'bg-gray-100';
            const inputBorderClass = theme === 'dark' ? 'border-gray-600' : 'border-gray-300';
            const textColorClass = theme === 'dark' ? 'text-white' : 'text-gray-900';
            const buttonBaseClass = `px-3 py-1.5 rounded-lg font-bold text-xl transition-all duration-200 shadow-md`;
            const buttonEnabledClass = `bg-blue-600 hover:bg-blue-700 text-white`;
            const buttonDisabledClass = `bg-gray-400 text-gray-700 cursor-not-allowed`;

            return (
                <div className="flex items-center space-x-2">
                    {/* Decrement button */}
                    <button onClick={decrement} disabled={value <= min} className={`${buttonBaseClass} ${value <= min ? buttonDisabledClass : buttonEnabledClass}`}>-</button>
                    {/* Display current value */}
                    <div className={`${widthClass} px-4 py-2 text-center ${textSizeClass} rounded-lg ${inputBgClass} ${inputBorderClass} focus:border-yellow-500 focus:outline-none ${textColorClass} appearance-none [-moz-appearance:textfield] [&::-webkit-outer-spin-button]:-webkit-appearance-none [&::-webkit-inner-spin-button]:-webkit-appearance-none transition-colors duration-500`}>{value}</div>
                    {/* Increment button */}
                    <button onClick={increment} disabled={value >= max} className={`${buttonBaseClass} ${value >= max ? buttonDisabledClass : buttonEnabledClass}`}>+</button>
                </div>
            );
        };

        /**
         * WheelPicker Component
         * A reusable iOS-style scroll wheel for picking a number, usable anywhere
         * a plain number input or NumberSpinner was used before. Works with touch
         * swipe, trackpad/mouse-wheel scroll (both are just native scrolling on
         * the underlying div), and click/tap via the +/- buttons on either side --
         * so it's equally usable on mobile and desktop regardless of input method.
         *
         * Callers should pick a `step` that keeps the total number of values
         * reasonable (a few hundred at most) -- e.g. step=25 for a $0-$5000
         * range, not step=1, to avoid rendering thousands of rows.
         *
         * @param {number} value - current value
         * @param {function} onChange - called with the new value
         * @param {number} min / max / step
         * @param {function} [formatValue] - (v) => display string, e.g. v => `$${v}`
         * @param {string} [width] - CSS width for the wheel itself, default '5rem'
         */
        // Standard chip/currency denominations -- covers cash-game cent values
        // through large tournament chip values. Used as the value list for chip
        // "Value" wheels, since real denominations aren't evenly spaced (no
        // fixed step would sensibly cover both $0.01 and $100,000).
        const STANDARD_CHIP_DENOMINATIONS = [
            0.01, 0.05, 0.10, 0.25, 0.50,
            1, 2, 5, 10, 20, 25, 50,
            100, 250, 500, 1000, 2500, 5000,
            10000, 25000, 50000, 100000
        ];

        /**
         * DraftNumberInput Component
         * A plain number input has a common frustration: if onChange does
         * something like `setValue(parseInt(e.target.value) || 0)`, the moment
         * you clear the field to retype a number, it immediately snaps back to
         * showing "0" (since parseInt('') is NaN, and NaN || 0 is 0) -- you can
         * never see it actually empty while typing.
         *
         * This component keeps a separate local "draft" string that's allowed
         * to be empty or mid-typing (like just "-" or "1."), only committing a
         * real number to the parent via onChange once the draft is a valid
         * number. If the field is left empty on blur, it reverts the display
         * back to the last committed value rather than staying stuck blank.
         *
         * @param {number} value - the committed numeric value
         * @param {function} onChange - called with a new number once valid
         * @param {number} [min] / [max] - optional clamping range
         * @param {boolean} [allowDecimal] - allow a decimal point (default false)
         */
        const DraftNumberInput = ({ value, onChange, min, max, allowDecimal = false, className, placeholder }) => {
            const toDisplayString = (v) => (v === null || v === undefined || Number.isNaN(v)) ? '' : String(v);
            const [draft, setDraft] = useState(() => toDisplayString(value));

            // Keep the draft in sync when the committed value changes from
            // OUTSIDE this input (e.g. a Reset button) -- but don't fight the
            // user mid-typing if the draft already represents the same number.
            useEffect(() => {
                const asString = toDisplayString(value);
                const draftAsNumber = draft === '' ? NaN : (allowDecimal ? parseFloat(draft) : parseInt(draft, 10));
                if (draftAsNumber !== value) {
                    setDraft(asString);
                }
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [value]);

            const commitIfValid = (raw) => {
                if (raw === '' || raw === '-') return; // still typing, nothing to commit yet
                const parsed = allowDecimal ? parseFloat(raw) : parseInt(raw, 10);
                if (Number.isNaN(parsed)) return;
                let clamped = parsed;
                if (typeof min === 'number') clamped = Math.max(min, clamped);
                if (typeof max === 'number') clamped = Math.min(max, clamped);
                onChange(clamped);
            };

            const handleChange = (e) => {
                const raw = e.target.value;
                const pattern = allowDecimal ? /^-?\d*\.?\d*$/ : /^-?\d*$/;
                if (raw === '' || pattern.test(raw)) {
                    setDraft(raw);
                    commitIfValid(raw);
                }
            };

            const handleBlur = () => {
                const parsed = draft === '' ? NaN : (allowDecimal ? parseFloat(draft) : parseInt(draft, 10));
                if (Number.isNaN(parsed)) {
                    setDraft(toDisplayString(value)); // revert to last committed value
                } else {
                    commitIfValid(draft);
                    setDraft(toDisplayString(parsed));
                }
            };

            return (
                <input
                    type="text"
                    inputMode={allowDecimal ? 'decimal' : 'numeric'}
                    value={draft}
                    onChange={handleChange}
                    onBlur={handleBlur}
                    placeholder={placeholder}
                    className={className}
                />
            );
        };


        const WheelPicker = ({ value, onChange, min, max, step = 1, values: customValues, formatValue, width = '5rem' }) => {
            const wheelRef = useRef(null);
            const ITEM_HEIGHT = 36;
            const VISIBLE_ROWS = 3;
            const PADDING = ITEM_HEIGHT; // one row above/below so first/last can center
            const RENDER_BUFFER = 12; // rows rendered above/below the current position

            // Either an explicit list of values (e.g. standard chip denominations,
            // which aren't evenly spaced) or a linear min/max/step range.
            const values = useMemo(() => {
                if (customValues && customValues.length) {
                    return [...customValues].sort((a, b) => a - b);
                }
                const out = [];
                const lo = Math.min(min, max), hi = Math.max(min, max);
                for (let v = lo; v <= hi + step / 2; v += step) {
                    out.push(Math.round(v * 1e6) / 1e6); // guard against float drift
                }
                return out.length ? out : [lo];
            }, [min, max, step, customValues]);

            const clampToValues = (v) => {
                let closest = values[0], minDiff = Math.abs(v - closest);
                for (const cand of values) {
                    const diff = Math.abs(v - cand);
                    if (diff < minDiff) { minDiff = diff; closest = cand; }
                }
                return closest;
            };

            // Only the rows near the current scroll position are actually
            // rendered -- large ranges (e.g. $1 steps up to $20,000) would
            // otherwise mean thousands of DOM nodes and a laggy wheel. The
            // rest of the scrollable height is simulated with padding.
            const [scrollTop, setScrollTop] = useState(0);
            const centerIndex = Math.max(0, Math.min(values.length - 1, Math.round(scrollTop / ITEM_HEIGHT)));
            const startIndex = Math.max(0, centerIndex - RENDER_BUFFER);
            const endIndex = Math.min(values.length - 1, centerIndex + RENDER_BUFFER);
            const visibleValues = values.slice(startIndex, endIndex + 1);
            const topSpacer = PADDING + startIndex * ITEM_HEIGHT;
            const bottomSpacer = PADDING + (values.length - 1 - endIndex) * ITEM_HEIGHT;

            // The highlighted item updates live on every scroll tick (cheap local
            // state, no parent re-render). The actual onChange commit to parent
            // state is debounced until scrolling settles. Committing on every
            // tick was fighting the browser's own momentum scrolling during a
            // fast swipe -- each commit changed `value`, which the scrollTop-sync
            // effect below would react to by force-correcting scrollTop, right in
            // the middle of the browser's own scroll animation. That fight is
            // what caused the value to visibly jump back and forth before
            // finally settling.
            const [liveValue, setLiveValue] = useState(value);
            const commitTimeoutRef = useRef(null);

            useLayoutEffect(() => {
                setLiveValue(value);
            }, [value]);

            useEffect(() => () => clearTimeout(commitTimeoutRef.current), []);

            // Distinguishes a genuine user scroll from a scroll event WE caused
            // ourselves (the position-correction effect below). Without this,
            // setting scrollTop programmatically fires a native 'scroll' event
            // that handleScroll would treat as real user input -- recomputing
            // and (after the debounce) re-committing a value. If that landed on
            // a neighboring row instead of the exact one (e.g. from CSS
            // scroll-snap adjusting position on the next frame, or the
            // virtualized window re-rendering asynchronously), the value would
            // silently drift by a step or two -- exactly the "200 became 240
            // after loading a preset" bug.
            const isProgrammaticScroll = useRef(false);

            const handleScroll = () => {
                if (!wheelRef.current) return;
                if (isProgrammaticScroll.current) {
                    isProgrammaticScroll.current = false;
                    setScrollTop(wheelRef.current.scrollTop); // keep virtualization window in sync
                    return;
                }

                const newScrollTop = wheelRef.current.scrollTop;
                setScrollTop(newScrollTop);

                const index = Math.round(newScrollTop / ITEM_HEIGHT);
                const clamped = Math.max(0, Math.min(values.length - 1, index));
                const nearestValue = values[clamped];
                if (nearestValue !== undefined && nearestValue !== liveValue) {
                    setLiveValue(nearestValue);
                }

                clearTimeout(commitTimeoutRef.current);
                commitTimeoutRef.current = setTimeout(() => {
                    if (nearestValue !== undefined && nearestValue !== value) {
                        onChange(nearestValue);
                    }
                }, 130);
            };

            useLayoutEffect(() => {
                if (!wheelRef.current) return;
                const index = values.findIndex(v => v === clampToValues(value));
                if (index >= 0) {
                    const target = index * ITEM_HEIGHT;
                    if (Math.abs(wheelRef.current.scrollTop - target) > 1) {
                        isProgrammaticScroll.current = true;
                        wheelRef.current.scrollTop = target;
                        setScrollTop(target);
                        // Safety net: if the scroll event this assignment should
                        // trigger doesn't actually fire for any reason, don't
                        // leave the flag stuck true forever -- that would cause
                        // the wheel to silently ignore the next real user scroll.
                        setTimeout(() => { isProgrammaticScroll.current = false; }, 60);
                    }
                }
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [value, values]);

            const stepClick = (dir) => {
                const idx = values.findIndex(v => v === clampToValues(value));
                const nextIdx = Math.max(0, Math.min(values.length - 1, idx + dir));
                onChange(values[nextIdx]);
            };

            return (
                <div className="inline-flex items-center gap-1.5">
                    <button
                        type="button"
                        onClick={() => stepClick(-1)}
                        className="w-7 h-7 rounded-full bg-gray-600 hover:bg-gray-500 text-white flex items-center justify-center shrink-0 font-bold"
                        aria-label="Decrease"
                    >−</button>
                    <div className="relative" style={{ height: ITEM_HEIGHT * VISIBLE_ROWS, width }}>
                        <div
                            className="absolute inset-x-0 pointer-events-none border-y-2 border-yellow-400/70 z-10"
                            style={{ top: PADDING, height: ITEM_HEIGHT }}
                        ></div>
                        <div
                            ref={wheelRef}
                            onScroll={handleScroll}
                            className="h-full overflow-y-scroll rounded-md bg-gray-900/60"
                            style={{ scrollSnapType: 'y mandatory' }}
                        >
                            <div style={{ height: topSpacer }}></div>
                            {visibleValues.map(v => (
                                <div
                                    key={v}
                                    className={`flex items-center justify-center font-bold transition-all ${v === liveValue ? 'text-yellow-300 text-base' : 'text-gray-500 text-sm'}`}
                                    style={{ height: ITEM_HEIGHT, scrollSnapAlign: 'center' }}
                                >
                                    {formatValue ? formatValue(v) : v}
                                </div>
                            ))}
                            <div style={{ height: bottomSpacer }}></div>
                        </div>
                    </div>
                    <button
                        type="button"
                        onClick={() => stepClick(1)}
                        className="w-7 h-7 rounded-full bg-gray-600 hover:bg-gray-500 text-white flex items-center justify-center shrink-0 font-bold"
                        aria-label="Increase"
                    >+</button>
                </div>
            );
        };

        /**
         * ZoomWidget Component
         * A manual size control, since browser DPI/zoom settings and window width
         * can make the fixed-width cards look small on some setups. Lets the user
         * scale the whole app up or down directly; their choice is remembered.
         */
        const ZoomWidget = ({ scale, onChange, theme }) => {
            const isDark = theme === 'dark';
            const btnCls = `w-8 h-8 flex items-center justify-center rounded-full font-bold text-lg ${isDark ? 'bg-gray-700 text-white hover:bg-gray-600' : 'bg-white text-gray-800 hover:bg-gray-100'} border ${isDark ? 'border-gray-600' : 'border-gray-300'}`;
            const clamp = (v) => Math.min(2, Math.max(0.6, Math.round(v * 100) / 100));
            return (
                <div
                    className={`fixed z-40 flex items-center gap-1.5 px-1.5 py-1 rounded-full shadow ${isDark ? 'bg-gray-800/90' : 'bg-white/90'} border ${isDark ? 'border-gray-600' : 'border-gray-300'}`}
                    style={{ bottom: 'max(0.75rem, env(safe-area-inset-bottom))', left: 'max(0.75rem, env(safe-area-inset-left))' }}
                >
                    <button onClick={() => onChange(clamp(scale - 0.1))} className={btnCls} aria-label="Zoom out">−</button>
                    <button
                        onClick={() => onChange(1)}
                        className={`px-2 text-xs font-semibold ${isDark ? 'text-gray-200' : 'text-gray-700'}`}
                        title="Reset size"
                    >
                        {Math.round(scale * 100)}%
                    </button>
                    <button onClick={() => onChange(clamp(scale + 0.1))} className={btnCls} aria-label="Zoom in">+</button>
                </div>
            );
        };

        /**
         * TrackingView Component
         * Embeds the user's separately-built poker tracking app inside an isolated
         * iframe. Using an iframe (rather than trying to merge two apps' code
         * together) means the tracker's own vanilla-JS globals and DOM IDs never
         * collide with this React app's code, and -- combined with keeping this
         * component permanently mounted at the App level -- its state stays alive
         * in the background exactly like the Tournament Clock and High Hand timers do.
         *
         * This renders as a true fixed, full-viewport overlay (not a padded card),
         * so the tracker fills the whole screen exactly as it does when the
         * standalone file is opened directly -- no extra chrome fighting its own
         * full-screen mobile layout. A small floating button is the only thing
         * layered on top, to get back to the rest of the app.
         */
        const TrackingView = ({ onBackToHome }) => {
            // The iframe is same-origin (no sandbox attribute), so it shares the exact
            // same localStorage as the rest of the app -- the existing cloud-pull-on-login
            // logic already restores the tracker's roster/history automatically. The only
            // extra step needed is to make sure the tracker's OWN writes (via its own,
            // separate `window` object inside the iframe) also trigger a cloud push,
            // since our earlier patch on the parent window's localStorage.setItem doesn't
            // reach into the iframe's separate realm.
            const handleIframeLoad = (e) => {
                try {
                    const iframeWindow = e.target.contentWindow;
                    const original = iframeWindow.localStorage.setItem.bind(iframeWindow.localStorage);
                    iframeWindow.localStorage.setItem = function (key, value) {
                        original(key, value);
                        if (window.__pushToCloud) window.__pushToCloud();
                    };
                } catch (err) {
                    console.error('Could not hook into Tracking app storage for cloud sync:', err);
                }
            };

            return (
                <div style={{ position: 'fixed', inset: 0, zIndex: 30 }}>
                    <button
                        onClick={onBackToHome}
                        className="fixed z-30 px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white font-semibold rounded-lg shadow-md transition-all duration-200"
                        style={{ top: 'max(0.75rem, env(safe-area-inset-top))', left: 'max(0.75rem, env(safe-area-inset-left))' }}
                    >
                        &larr; Home
                    </button>
                    <iframe
                        srcDoc={TRACKER_HTML}
                        title="Poker Logbook"
                        onLoad={handleIframeLoad}
                        style={{ width: '100%', height: '100%', border: 'none', display: 'block' }}
                    />
                </div>
            );
        };

        /**
         * InvitesView Component
         * Lets the host create events, add invitees (by phone or email), send them
         * an invite (via the phone's own Messages/Mail app -- there's no way for a
         * webpage to send SMS/email on its own, this just hands off to the device),
         * and manually track RSVP status plus who actually showed up afterward.
         * Data is stored the same way as the rest of the app (localStorage, which
         * the existing cloud sync already picks up automatically for logged-in users).
         */
        const InvitesView = ({ theme, appBgClass, mainCardBgClass, sectionBgClass, inputBgClass, inputBorderClass, subtextColorClass, placeholderColorClass, headingTextColorClass, onBackToHome, isActive }) => {
            const [tab, setTab] = useState('events'); // 'events' | 'contacts'
            const [events, setEvents] = useState(() => {
                try { return JSON.parse(localStorage.getItem('pokerAppInvites') || '[]'); } catch (e) { return []; }
            });
            const [currentEventId, setCurrentEventId] = useState(() => localStorage.getItem('pokerAppInvitesCurrentEvent') || null);
            const [newEventTitle, setNewEventTitle] = useState('');
            const [newEventDate, setNewEventDate] = useState('');
            const [newEventStartTime, setNewEventStartTime] = useState('');
            const [newEventEndTime, setNewEventEndTime] = useState('');
            const [editingMessage, setEditingMessage] = useState(false);
            const [messageDraft, setMessageDraft] = useState('');

            // --- Contacts: a persistent address book, reused across every event ---
            // Each contact can have a phone AND/OR an email -- these used to be
            // separate records (one contact = one method), which caused confusion
            // when editing (the Phone/Email toggle just relabeled the same value
            // instead of giving you two real fields). migrateContacts below folds
            // any old-format data into this new shape automatically, merging by name.
            const migrateContacts = (rawContacts) => {
                if (!rawContacts.length || !('contactType' in rawContacts[0])) return rawContacts;
                const merged = {};
                rawContacts.forEach(c => {
                    const key = c.name.trim().toLowerCase();
                    if (!merged[key]) merged[key] = { id: c.id, name: c.name, phone: '', email: '' };
                    if (c.contactType === 'phone' && !merged[key].phone) merged[key].phone = c.contact;
                    else if (c.contactType === 'email' && !merged[key].email) merged[key].email = c.contact;
                });
                return Object.values(merged);
            };

            const [contacts, setContacts] = useState(() => {
                try {
                    const raw = JSON.parse(localStorage.getItem('pokerAppContacts') || '[]');
                    return migrateContacts(raw);
                } catch (e) { return []; }
            });
            const [newContactName, setNewContactName] = useState('');
            const [newContactPhone, setNewContactPhone] = useState('');
            const [newContactEmail, setNewContactEmail] = useState('');
            const [editingContactId, setEditingContactId] = useState(null);
            const [contactSearchQuery, setContactSearchQuery] = useState('');
            const [contactSortMode, setContactSortMode] = useState('alpha'); // 'alpha' | 'attendance'
            const [editContactName, setEditContactName] = useState('');
            const [editContactPhone, setEditContactPhone] = useState('');
            const [editContactEmail, setEditContactEmail] = useState('');

            // The Logbook (Tracking tab) and Contacts share the same browser storage
            // (same-origin iframe), so we can read its roster directly -- this keeps
            // the two lists in sync without any extra plumbing or manual "sync" step.
            const [logbookRoster, setLogbookRoster] = useState(() => {
                try { return JSON.parse(localStorage.getItem('poker_pro_roster') || '[]'); } catch (e) { return []; }
            });

            useEffect(() => {
                localStorage.setItem('pokerAppInvites', JSON.stringify(events));
            }, [events]);

            useEffect(() => {
                localStorage.setItem('pokerAppContacts', JSON.stringify(contacts));
            }, [contacts]);

            useEffect(() => {
                if (currentEventId) localStorage.setItem('pokerAppInvitesCurrentEvent', currentEventId);
                else localStorage.removeItem('pokerAppInvitesCurrentEvent');
            }, [currentEventId]);

            // The Logbook can update event attendance (via a linked session) while
            // this tab is sitting in the background -- re-sync from storage whenever
            // this tab becomes the active view again, so those updates show up
            // without needing a full page refresh.
            useEffect(() => {
                if (!isActive) return;
                try {
                    const fresh = JSON.parse(localStorage.getItem('pokerAppInvites') || '[]');
                    setEvents(fresh);
                } catch (e) { /* ignore */ }
            }, [isActive]);

            // Keeps the roster suggestions live while this tab is open, in case a
            // name gets added over in the Logbook in the same session.
            useEffect(() => {
                const refreshRoster = () => {
                    try { setLogbookRoster(JSON.parse(localStorage.getItem('poker_pro_roster') || '[]')); }
                    catch (e) { /* ignore */ }
                };
                refreshRoster();
                window.addEventListener('focus', refreshRoster);
                const interval = setInterval(refreshRoster, 3000);
                return () => { window.removeEventListener('focus', refreshRoster); clearInterval(interval); };
            }, []);

            const currentEvent = events.find(e => e.id === currentEventId);

            const formatTimeDisplay = (time24) => {
                if (!time24) return '';
                const [h, m] = time24.split(':').map(Number);
                const period = h >= 12 ? 'PM' : 'AM';
                const h12 = h % 12 === 0 ? 12 : h % 12;
                return `${h12}:${String(m).padStart(2, '0')} ${period}`;
            };

            const defaultMessage = (title, date, startTime, endTime) => {
                let when = date ? ' on ' + date : '';
                if (startTime) {
                    when += ` at ${formatTimeDisplay(startTime)}`;
                    if (endTime) when += ` - ${formatTimeDisplay(endTime)}`;
                }
                return `Hey! You're invited to ${title}${when}. Let me know if you can make it!`;
            };

            // --- Event management ---
            const createEvent = () => {
                if (!newEventTitle.trim()) return;
                const id = Date.now().toString();
                const event = {
                    id, title: newEventTitle.trim(), date: newEventDate || '',
                    startTime: newEventStartTime || '', endTime: newEventEndTime || '',
                    invitees: [],
                    message: defaultMessage(newEventTitle.trim(), newEventDate, newEventStartTime, newEventEndTime)
                };
                setEvents(prev => [event, ...prev]);
                setCurrentEventId(id);
                setNewEventTitle('');
                setNewEventDate('');
                setNewEventStartTime('');
                setNewEventEndTime('');
            };

            const deleteEvent = (id) => {
                const event = events.find(e => e.id === id);
                const label = event ? `"${event.title}"` : 'this event';
                if (!confirm(`Delete ${label}? This can't be undone.`)) return;
                setEvents(prev => prev.filter(e => e.id !== id));
                if (currentEventId === id) setCurrentEventId(null);
            };

            const updateCurrentEvent = (updater) => {
                setEvents(prev => prev.map(e => e.id === currentEventId ? updater(e) : e));
            };

            // --- Contact management (persistent, independent of any one event) ---

            // Keeps this in sync with the Logbook the other direction too: any new
            // name added here also gets added to the Logbook's roster (name only --
            // the Logbook roster doesn't store contact info), so it's ready to go
            // next time the Logbook loads.
            const addNameToLogbookRoster = (name) => {
                try {
                    const roster = JSON.parse(localStorage.getItem('poker_pro_roster') || '[]');
                    if (!roster.some(r => r.trim().toLowerCase() === name.trim().toLowerCase())) {
                        roster.push(name.trim());
                        roster.sort((a, b) => a.localeCompare(b));
                        localStorage.setItem('poker_pro_roster', JSON.stringify(roster));
                    }
                } catch (e) {
                    console.error('Could not sync name to Logbook roster:', e);
                }
            };

            const addContact = () => {
                if (!newContactName.trim() || (!newContactPhone.trim() && !newContactEmail.trim())) return;
                const contact = {
                    id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
                    name: newContactName.trim(),
                    phone: newContactPhone.trim(),
                    email: newContactEmail.trim()
                };
                setContacts(prev => [...prev, contact]);
                addNameToLogbookRoster(contact.name);
                setNewContactName('');
                setNewContactPhone('');
                setNewContactEmail('');
            };

            const quickAddContactFromRoster = (name) => {
                setNewContactName(name);
            };

            // The Contact Picker API lets the user pick straight from their phone's
            // native contacts app -- currently supported on Android Chrome/Edge and
            // similar Chromium browsers. Safari/iOS hasn't implemented this API yet,
            // so this is offered as a shortcut where available, not a requirement.
            const contactPickerSupported = typeof navigator !== 'undefined' && 'contacts' in navigator && typeof navigator.contacts?.select === 'function';
            const [pendingImports, setPendingImports] = useState(null); // null | array awaiting review

            // Strips common phone-contact clutter -- "(Falls Grove)", "(Work)", extra
            // spaces -- so "Jon Gillett (Falls Grove)" compares fairly against "Jon Gillett".
            const normalizeName = (name) => name
                .replace(/\(.*?\)/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();

            // Simple edit-distance check to catch near-misses (typos, "Jon Gillett"
            // vs "Jon Gillet") that a strict comparison would miss.
            const levenshteinDistance = (a, b) => {
                const m = a.length, n = b.length;
                const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
                for (let i = 0; i <= m; i++) dp[i][0] = i;
                for (let j = 0; j <= n; j++) dp[0][j] = j;
                for (let i = 1; i <= m; i++) {
                    for (let j = 1; j <= n; j++) {
                        dp[i][j] = a[i - 1] === b[j - 1]
                            ? dp[i - 1][j - 1]
                            : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
                    }
                }
                return dp[m][n];
            };

            const namesAreCloseMatch = (nameA, nameB) => {
                const a = normalizeName(nameA), b = normalizeName(nameB);
                if (!a || !b) return false;
                if (a === b) return true;
                if (a.includes(b) || b.includes(a)) return true; // one fully contains the other
                // Small edit distance relative to name length = likely the same person,
                // just typed slightly differently. Skip very short names to avoid
                // false positives (e.g. "Al" vs "Ed").
                const maxLen = Math.max(a.length, b.length);
                if (maxLen < 5) return false;
                return levenshteinDistance(a, b) <= 2;
            };

            // Cross-references incoming imports against existing Contacts by name, so
            // the review screen can flag duplicates and default to the sensible
            // choice (skip what's already on file, only add what's genuinely new).
            // matchedContactId records which existing contact to MERGE into, rather
            // than creating a brand new (near-)duplicate entry.
            const enrichWithDuplicateInfo = (rawList) => {
                return rawList.map(item => {
                    const matches = contacts.filter(c => namesAreCloseMatch(c.name, item.name));
                    const hasExistingPhone = matches.some(c => c.phone);
                    const hasExistingEmail = matches.some(c => c.email);
                    return {
                        name: item.name,
                        phones: item.phones,
                        emails: item.emails,
                        selectedPhoneIndex: 0,
                        includePhone: item.phones.length > 0 && !hasExistingPhone,
                        includeEmail: item.emails.length > 0 && !hasExistingEmail,
                        isDuplicate: matches.length > 0,
                        matchedNames: [...new Set(matches.map(m => m.name))],
                        matchedContactId: matches.length > 0 ? matches[0].id : null,
                        hasExistingPhone,
                        hasExistingEmail
                    };
                });
            };

            const importFromPhoneContacts = async () => {
                try {
                    const selected = await navigator.contacts.select(['name', 'tel', 'email'], { multiple: true });
                    if (!selected || !selected.length) return;
                    const raw = selected
                        .map(c => ({
                            name: (c.name && c.name[0]) || 'Unnamed',
                            phones: c.tel || [],
                            emails: c.email || []
                        }))
                        .filter(c => c.phones.length > 0 || c.emails.length > 0); // skip contacts with no usable info
                    if (!raw.length) return;
                    setPendingImports(enrichWithDuplicateInfo(raw));
                } catch (err) {
                    console.error('Contact import cancelled or failed:', err);
                }
            };

            const updatePendingImport = (index, updater) => {
                setPendingImports(prev => prev.map((p, i) => i === index ? updater(p) : p));
            };

            const confirmImport = () => {
                let updatedContacts = [...contacts];
                const namesToSync = [];

                pendingImports.forEach(p => {
                    const phoneToAdd = p.includePhone && p.phones.length > 0 ? (p.phones[p.selectedPhoneIndex] || p.phones[0]) : '';
                    const emailToAdd = p.includeEmail && p.emails.length > 0 ? p.emails[0] : '';
                    if (!phoneToAdd && !emailToAdd) return; // nothing selected for this person

                    if (p.matchedContactId) {
                        // Merge into the existing contact rather than creating a duplicate.
                        updatedContacts = updatedContacts.map(c => c.id === p.matchedContactId
                            ? { ...c, phone: c.phone || phoneToAdd, email: c.email || emailToAdd }
                            : c);
                    } else {
                        updatedContacts.push({
                            id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
                            name: p.name, phone: phoneToAdd, email: emailToAdd
                        });
                    }
                    namesToSync.push(p.name);
                });

                if (namesToSync.length) {
                    setContacts(updatedContacts);
                    namesToSync.forEach(name => addNameToLogbookRoster(name));
                }
                setPendingImports(null);
            };

            const cancelImport = () => setPendingImports(null);

            // --- .vcf (vCard) file import -- the fallback for iPhone, since Safari
            // doesn't support the Contact Picker API. iPhone's Contacts app (or
            // iCloud.com/contacts) can export contacts as a .vcf file, which this
            // parses into the same review screen used for the Android picker above.
            const parseVCardFile = (text) => {
                const cards = text.split(/BEGIN:VCARD/i).slice(1);
                const parsed = [];
                cards.forEach(cardText => {
                    const lines = cardText.split(/\r?\n/);
                    let name = '';
                    const phones = [];
                    const emails = [];
                    lines.forEach(rawLine => {
                        const line = rawLine.trim();
                        if (!line || /^END:VCARD/i.test(line)) return;
                        const colonIdx = line.indexOf(':');
                        if (colonIdx === -1) return;
                        const key = line.slice(0, colonIdx).split(';')[0].toUpperCase();
                        const value = line.slice(colonIdx + 1).trim();
                        if (!value) return;
                        if (key === 'FN' && !name) {
                            name = value;
                        } else if (key === 'N' && !name) {
                            const parts = value.split(';').filter(Boolean);
                            name = parts.slice(0, 2).reverse().join(' ').trim();
                        } else if (key === 'TEL') {
                            phones.push(value);
                        } else if (key === 'EMAIL') {
                            emails.push(value);
                        }
                    });
                    if (phones.length || emails.length) {
                        parsed.push({ name: name || 'Unnamed', phones, emails });
                    }
                });
                return parsed;
            };

            const handleVcfFileSelected = (e) => {
                const file = e.target.files[0];
                e.target.value = ''; // allow re-selecting the same file later
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = parseVCardFile(ev.target.result);
                        if (!parsed.length) {
                            alert("Couldn't find any contacts with a phone number or email in that file.");
                            return;
                        }
                        setPendingImports(enrichWithDuplicateInfo(parsed));
                    } catch (err) {
                        console.error('vCard parse failed:', err);
                        alert("Couldn't read that file -- make sure it's a .vcf contacts file.");
                    }
                };
                reader.readAsText(file);
            };

            const startEditingContact = (c) => {
                setEditingContactId(c.id);
                setEditContactName(c.name);
                setEditContactPhone(c.phone || '');
                setEditContactEmail(c.email || '');
            };

            const saveEditingContact = () => {
                if (!editContactName.trim() || (!editContactPhone.trim() && !editContactEmail.trim())) return;
                setContacts(prev => prev.map(c => c.id === editingContactId
                    ? { ...c, name: editContactName.trim(), phone: editContactPhone.trim(), email: editContactEmail.trim() }
                    : c));
                setEditingContactId(null);
            };

            const cancelEditingContact = () => setEditingContactId(null);

            const deleteContact = (id) => {
                setContacts(prev => prev.filter(c => c.id !== id));
            };

            // --- Selecting who's invited to the current event, straight from Contacts ---
            const isInvited = (contactId) => !!(currentEvent && currentEvent.invitees.some(i => i.contactId === contactId));

            // Tallies a contact's history across every event they've ever been
            // invited to -- powers both the stats shown in the Contacts list and
            // the "Most Regular" sort option.
            const getContactStats = (contactId) => {
                const allInvites = events.flatMap(e => e.invitees.filter(i => i.contactId === contactId));
                const came = allInvites.filter(i => i.status === 'yes' && i.attended !== false).length;
                const flaked = allInvites.filter(i => i.status === 'yes' && i.attended === false).length;
                const declined = allInvites.filter(i => i.status === 'no').length;
                const noResponse = allInvites.filter(i => i.status === 'pending').length;
                return { total: allInvites.length, came, flaked, declined, noResponse };
            };

            const toggleInviteContact = (contact) => {
                updateCurrentEvent(e => {
                    const already = e.invitees.some(i => i.contactId === contact.id);
                    if (already) {
                        return { ...e, invitees: e.invitees.filter(i => i.contactId !== contact.id) };
                    }
                    const invitee = {
                        id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
                        contactId: contact.id, name: contact.name,
                        phone: contact.phone || '', email: contact.email || '',
                        status: 'pending', attended: null
                    };
                    return { ...e, invitees: [...e.invitees, invitee] };
                });
            };

            const setStatus = (inviteeId, status) => {
                updateCurrentEvent(e => ({
                    ...e,
                    invitees: e.invitees.map(i => i.id === inviteeId ? { ...i, status, attended: status === 'yes' ? i.attended : null } : i)
                }));
            };

            const setAttended = (inviteeId, attended) => {
                updateCurrentEvent(e => ({ ...e, invitees: e.invitees.map(i => i.id === inviteeId ? { ...i, attended } : i) }));
            };

            const startEditingMessage = () => {
                setMessageDraft(currentEvent.message || defaultMessage(currentEvent.title, currentEvent.date, currentEvent.startTime, currentEvent.endTime));
                setEditingMessage(true);
            };

            const saveMessage = () => {
                updateCurrentEvent(e => ({ ...e, message: messageDraft }));
                setEditingMessage(false);
            };

            const getMessage = (event) => event.message || defaultMessage(event.title, event.date, event.startTime, event.endTime);

            // Builds a standard .ics (iCalendar) file for the event -- this is an
            // open format every calendar app understands (Apple, Google, Outlook,
            // etc.), so tapping it hands off to whatever's set as the default
            // calendar app rather than us needing to integrate with any one of
            // them specifically. Currently creates an all-day event, since Invites
            // only collects a date, not a specific time.
            const escapeICSText = (s) => (s || '')
                .replace(/\\/g, '\\\\')
                .replace(/;/g, '\\;')
                .replace(/,/g, '\\,')
                .replace(/\n/g, '\\n');

            const formatEventDateTime = (event) => {
                if (!event.date) return 'No date set';
                let result = event.date;
                if (event.startTime) {
                    result += ` at ${formatTimeDisplay(event.startTime)}`;
                    if (event.endTime) result += ` - ${formatTimeDisplay(event.endTime)}`;
                }
                return result;
            };

            const buildICS = (event) => {
                if (!event.date) return null;
                const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                const dateCompact = event.date.replace(/-/g, '');
                let dtStartLine, dtEndLine;

                if (event.startTime) {
                    // A "floating" local time (no Z, no TZID) -- calendar apps treat
                    // this as the device's own local time, which is the right
                    // behavior here since there's no timezone info collected.
                    const startCompact = event.startTime.replace(':', '') + '00';
                    dtStartLine = `DTSTART:${dateCompact}T${startCompact}`;

                    let endCompact;
                    if (event.endTime) {
                        endCompact = event.endTime.replace(':', '') + '00';
                    } else {
                        // No end time given -- default to a 4-hour block, typical for a poker night.
                        const [h, m] = event.startTime.split(':').map(Number);
                        const endDate = new Date(2000, 0, 1, h, m);
                        endDate.setHours(endDate.getHours() + 4);
                        endCompact = `${String(endDate.getHours()).padStart(2, '0')}${String(endDate.getMinutes()).padStart(2, '0')}00`;
                    }
                    dtEndLine = `DTEND:${dateCompact}T${endCompact}`;
                } else {
                    // No time given at all -- fall back to an all-day event.
                    const endDateObj = new Date(event.date + 'T00:00:00');
                    endDateObj.setDate(endDateObj.getDate() + 1); // DTEND is exclusive for all-day events
                    const endDateCompact = endDateObj.toISOString().slice(0, 10).replace(/-/g, '');
                    dtStartLine = `DTSTART;VALUE=DATE:${dateCompact}`;
                    dtEndLine = `DTEND;VALUE=DATE:${endDateCompact}`;
                }

                const lines = [
                    'BEGIN:VCALENDAR',
                    'VERSION:2.0',
                    'PRODID:-//The House Edge//Invites//EN',
                    'CALSCALE:GREGORIAN',
                    'BEGIN:VEVENT',
                    `UID:${event.id}@thehouseedge.net`,
                    `DTSTAMP:${stamp}`,
                    dtStartLine,
                    dtEndLine,
                    `SUMMARY:${escapeICSText(event.title)}`,
                    `DESCRIPTION:${escapeICSText(getMessage(event))}`,
                    'END:VEVENT',
                    'END:VCALENDAR'
                ];
                return lines.join('\r\n');
            };

            const calendarFileLink = (event) => {
                const ics = buildICS(event);
                if (!ics) return null;
                return `data:text/calendar;charset=utf-8,${encodeURIComponent(ics)}`;
            };

            // Uploads the event's .ics file to Firebase Storage so invitees (who
            // aren't logged in and can't run any app code) can just tap a plain
            // link in their text/email to add it to their own calendar, the same
            // way the host's own "Add to Calendar" button works locally. Also
            // shortens the resulting link via TinyURL -- SMS/mailto: bodies are
            // plain text with no way to attach custom "click here" link text, so
            // a short, clean-looking URL is the best available alternative.
            const uploadICSForEvent = async (event) => {
                if (!window.__currentUser) return; // requires being logged in (Pro feature)
                const ics = buildICS(event);
                if (!ics) return;
                try {
                    const path = `icsFiles/${window.__currentUser.uid}/${event.id}.ics`;
                    const ref = window.__firebaseStorage.ref(path);
                    await ref.putString(ics, 'raw', { contentType: 'text/calendar' });
                    const url = await ref.getDownloadURL();

                    let shortUrl = url;
                    try {
                        const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(url)}`);
                        if (res.ok) {
                            const text = (await res.text()).trim();
                            if (text.startsWith('http')) shortUrl = text;
                        }
                    } catch (shortenErr) {
                        console.error('Could not shorten calendar link, using full link instead:', shortenErr);
                    }

                    setEvents(prev => prev.map(e => e.id === event.id ? { ...e, icsUrl: url, icsShortUrl: shortUrl } : e));
                } catch (err) {
                    console.error('Could not upload calendar file:', err);
                }
            };

            // Re-uploads whenever anything that affects the calendar file changes,
            // so the hosted link always reflects the latest details -- keyed on the
            // plain values (not the whole event object) so updating icsUrl itself
            // doesn't cause this to loop.
            useEffect(() => {
                if (!currentEvent) return;
                uploadICSForEvent(currentEvent);
            }, [currentEvent?.id, currentEvent?.title, currentEvent?.date, currentEvent?.startTime, currentEvent?.endTime]);

            // The editable message (shown/edited in the UI) never includes the
            // calendar link directly -- it's appended automatically only when
            // actually sending, so editing your message doesn't require retyping it.
            const getOutgoingMessage = (event) => {
                const base = getMessage(event);
                if (event.includeCalendarLink === false) return base;
                const link = event.icsShortUrl || event.icsUrl;
                return link ? `${base}\n\nAdd to calendar: ${link}` : base;
            };

            const smsLink = (invitee, event) => `sms:${invitee.phone}?body=${encodeURIComponent(getOutgoingMessage(event))}`;
            const emailLink = (invitee, event) => `mailto:${invitee.email}?subject=${encodeURIComponent(event.title + ' - Invite')}&body=${encodeURIComponent(getOutgoingMessage(event))}`;

            const textAllPending = () => {
                if (!currentEvent) return;
                const numbers = currentEvent.invitees.filter(i => i.status === 'pending' && i.phone).map(i => i.phone);
                if (!numbers.length) return;

                setIndividualTextQueue(queue);
                setIndividualTextIndex(0);

                if (individualTextIndex + 1 >= individualTextQueue.length) {

            const stats = currentEvent ? {

            const sortedFilteredContacts = [...contacts]
                .filter(c => c.name.toLowerCase().includes(contactSearchQuery.trim().toLowerCase()))

                                                        <input

                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}

                            <button onClick={() => setCurrentEventId(null)} className={`text-sm mb-3 underline text-left text-slate-100`}>&larr; All Events</button>

                                    <h3 className={`text-xl font-bold text-blue-500`}>{currentEvent.title}</h3>
                                    <p className={`text-sm text-slate-500`}>{formatEventDateTime(currentEvent)}</p>
                                </div>
                                {calendarFileLink(currentEvent) && (
                                    <a

                                        download={`${(currentEvent.title || 'event').replace(/[^a-z0-9]/gi, '_')}.ics`}
                                        className="shrink-0 px-3 py-2 rounded-lg text-xs font-semibold bg-slate-900 text-slate-100 border border-slate-700 hover:bg-slate-800 whitespace-nowrap"

            const tryDistributeForCashTarget = (targetStackCents, numPlayers, denominationsCents, bias) => {
                if (!targetStackCents || targetStackCents <= 0) return null;
                if (!numPlayers || numPlayers <= 0) return null;
                if (!denominationsCents || denominationsCents.length === 0) return null;

                const chipsSorted = [...denominationsCents]
                    .filter(c => c.valueCents > 0 && c.quantity > 0)

                if (chipsSorted.length === 0) return null;

                const n = chipsSorted.length;

                // Reserve a practical minimum of the smallest chip up front (enough
                // to post the actual small/big blind a couple of times over) --
                // this is the fixed "base layer" every buy-in level shares, so a
                // player who rebuys up from min to max just gets more/bigger chips
                // stacked on top, not a totally different mix of small chips.
                const capRemainingByChip = [...perPlayerCapByChip];
                {
                    const smallest = chipsSorted[0];
                    const smallestCap = capRemainingByChip[0];
                    const referenceSBCents = cashSmallBlind > 0 ? Math.round(cashSmallBlind * 100) : smallest.valueCents;
                    const desiredMin = Math.min(
                        smallestCap,
                        Math.ceil((referenceSBCents * 2) / smallest.valueCents),
                        Math.floor(remainingValue / smallest.valueCents)
                    );
                    if (desiredMin > 0) {
                        perPlayer[smallest.id] = desiredMin;
                        remainingValue -= desiredMin * smallest.valueCents;
                        capRemainingByChip[0] -= desiredMin;

                                    if (hi < n) { seq.push(hi); hi++; }
                                }

            const computeCashDistributionForTarget = (ideal, numPlayers, denominations, bias) => {
                if (!ideal || ideal <= 0) return null;
                if (!numPlayers || numPlayers <= 0) return null;

                    quantity: c.quantity,

                const stepCents = Math.max(1, toCents(stepDollars));
                const maxSpanCents = stepCents * 400;
