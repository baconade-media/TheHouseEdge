    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600&family=Montserrat:wght@400;700&family=Rajdhani:wght@500;700&family=Playfair+Display:wght@600;800&family=Russo+One&display=swap" rel="stylesheet">
    <style>
      /* Base styles for html, body, and root to ensure full height and visible background */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #111827;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none;
      }
      /* Custom font application */
      .font-outfit {
        font-family: 'Outfit', sans-serif;
      }
      /* Respect notches / home-indicator areas on phones */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
      /* iOS zooms the page in if a focused input's font-size is under 16px; keep it at 16px so typing doesn't jump the zoom level */
      input, select, textarea {
        font-size: 16px;
      }
      /* On touchscreens specifically (phones/tablets, not mouse/trackpad desktops),
         guarantee every button/link is at least ~44px tall -- the generally
         recommended minimum reliable tap target -- even if its visual padding is
         small. This doesn't change anything on desktop. */
      @media (pointer: coarse) {
        button {
          min-height: 44px;
        }
        /* CSS zoom has a known bug on touchscreens: the visual position of
           content can drift away from where taps actually register, especially
           across orientation changes -- showing up as "dead zones" that don't
           respond to touch. The zoom control was only ever meant to help on
           desktop monitors (where this bug doesn't happen), so it's switched
           off entirely on touch devices instead. */
        .zoom-scale-container {
          zoom: 1 !important;
        }
      }

      /* Lets the Tournament view's "inner box" color/transparency setting
         override the smaller boxes (Blinds, Prize Pool, Chip Values, etc.)
         throughout the card in one place, rather than needing to touch each
         of the ~24 individual elements that use these classes. Scoped to
         .tournament-scoped specifically so it never affects the same
         Tailwind classes used elsewhere in the app. */
      .tournament-scoped .bg-gray-600,
      .tournament-scoped .bg-gray-200 {
        background-color: var(--tournament-section-bg) !important;
      }
      .cash-scoped .bg-gray-600,
      .cash-scoped .bg-gray-200 {
        background-color: var(--cash-section-bg) !important;
      }
    </style>
</head>
<body>

    <!-- Firebase (Authentication + Firestore for login / cross-device sync + Storage for hosted files) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyD377ROit6RCFMX9sEFey2adhHRbEDwelc",
        authDomain: "the-house-edge.firebaseapp.com",
        projectId: "the-house-edge",
        storageBucket: "the-house-edge.firebasestorage.app",
        messagingSenderId: "561320193274",
        appId: "1:561320193274:web:7ffe4983693271166bed43",
        measurementId: "G-3H4E245K0W"
      };
      firebase.initializeApp(firebaseConfig);
      window.__firebaseAuth = firebase.auth();
      window.__firebaseDb = firebase.firestore();
      window.__firebaseStorage = firebase.storage();

      // --- Cloud sync helpers (operate directly on localStorage) ---
      window.__currentUser = null;
      window.__cloudSyncTimeout = null;

      // Settings that should stay local to THIS device/browser rather than
      // following the account everywhere -- e.g. zoom level, which needs to be
      // very different on a phone vs. a desktop monitor.
      window.__DEVICE_LOCAL_KEYS = new Set(['uiScale']);

      function __dumpLocalStorage() {
        const dump = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (window.__DEVICE_LOCAL_KEYS.has(k)) continue;
          dump[k] = localStorage.getItem(k);
        }
        return dump;
      }

      function __pushToCloud() {
        if (!window.__currentUser) return;
        clearTimeout(window.__cloudSyncTimeout);
        window.__cloudSyncTimeout = setTimeout(() => {
          const dump = __dumpLocalStorage();
          window.__firebaseDb.collection('userSettings').doc(window.__currentUser.uid).set({
            dump: JSON.stringify(dump),
            updatedAt: Date.now()
          }, { merge: true }).catch(e => console.error('Cloud push failed:', e));
        }, 1200);
      }

      async function __pullFromCloud(uid) {
        try {
          const doc = await window.__firebaseDb.collection('userSettings').doc(uid).get();
          if (doc.exists && doc.data().dump) {
            const data = JSON.parse(doc.data().dump);
            // Use the original (unpatched) setItem so restoring cloud data doesn't
            // immediately queue a redundant push back to the cloud.
            const write = localStorage.setItem.__original || localStorage.setItem.bind(localStorage);
            Object.keys(data).forEach(k => {
              if (window.__DEVICE_LOCAL_KEYS.has(k)) return;
              write(k, data[k]);
            });
          }
        } catch (e) {
          console.error('Cloud pull failed:', e);
        }
      }

      // Resolves the user's Free/Pro tier, admin status, and a couple of display
      // fields for the admin page (email, join date). Anyone who already had a
      // document before this system existed is grandfathered in as Pro --
      // brand new accounts (no prior document at all) start on Free.
      //
      // Honest limitation: without a backend, this initial grant can't be made
      // fully tamper-proof against someone editing things via devtools -- a
      // determined user could theoretically front-run their very first write.
      // The Firestore rules below do prevent anyone from *repeatedly* changing
      // their own tier after that first write, which covers the realistic
      // risk for a pre-payment, friends-and-family stage. Once real billing is
      // connected, tier should be set by a trusted backend (e.g. a Cloud
      // Function reacting to a Stripe webhook) instead of client code.
      // Whether someone currently has Pro-level access -- true if they're
      // actually on the Pro tier, OR if they're in the middle of an active
      // trial. Used everywhere the app needs to ask "does this person get Pro
      // features," instead of checking `tier` directly.
      window.__isEffectivelyPro = (data) => {
        if (!data) return false;
        if (data.tier === 'pro') return true;
        if (data.trialEndsAt && data.trialEndsAt > Date.now()) return true;
        return false;
      };

      async function __resolveUserTier(user) {
        const ref = window.__firebaseDb.collection('userSettings').doc(user.uid);

        // Read first. If even this fails, we genuinely don't know anything about
        // this user yet, so falling back to safe defaults (Free, not admin) is
        // the right move.
        let data = null;
        try {
          const doc = await ref.get();
          data = doc.exists ? doc.data() : null;
        } catch (e) {
          console.error('Could not read user tier data:', e);
          window.__userTier = 'free';
          window.__isAdmin = false;
          window.__trialEndsAt = null;
          window.__trialUsed = false;
          window.__isEffectivePro = false;
          return;
        }

        // Figure out which fields (if any) need backfilling.
        const updates = {};
        if (!data || typeof data.tier === 'undefined') {
          updates.tier = (data && (data.dump || data.updatedAt)) ? 'pro' : 'free';
        }
        if (!data || typeof data.isAdmin === 'undefined') {
          updates.isAdmin = false;
        }
        if (!data || data.email !== user.email) {
          updates.email = user.email || '';
        }
        if (!data || typeof data.createdAt === 'undefined') {
          updates.createdAt = user.metadata?.creationTime ? new Date(user.metadata.creationTime).getTime() : Date.now();
        }

        // Try to write the backfill, but a failure here must NOT be allowed to
        // corrupt what we already successfully read -- e.g. if this write gets
        // rejected for any reason, an admin's isAdmin:true (already confirmed
        // via the read above) should never get reset to false just because a
        // background housekeeping write didn't go through.
        if (Object.keys(updates).length > 0) {
          try {
            await ref.set(updates, { merge: true });
          } catch (e) {
            console.error('Could not write tier backfill (continuing with existing data):', e);
          }
        }

        const merged = { ...data, ...updates };
        window.__userTier = merged.tier || 'free';
        window.__isAdmin = !!merged.isAdmin;
        window.__trialEndsAt = merged.trialEndsAt || null;
        window.__trialUsed = !!merged.trialUsed;
        window.__isEffectivePro = window.__isEffectivelyPro(merged);
      }

      // Monkey-patch localStorage.setItem so every existing setting write in the app
      // automatically queues a cloud sync too, without editing hundreds of call sites.
      (function () {
        const original = localStorage.setItem.bind(localStorage);
        const patched = function (key, value) {
          original(key, value);
          __pushToCloud();
        };
        patched.__original = original;
        localStorage.setItem = patched;
      })();

      // Resolves once we know the auth state AND (if logged in) have pulled cloud data
      // into localStorage -- so the app's useState(() => localStorage.getItem(...))
      // initializers see the right values on first render.
      window.__authReadyPromise = new Promise((resolve) => {
        let settled = false;
        window.__firebaseAuth.onAuthStateChanged(async (user) => {
          if (user) {
            await __pullFromCloud(user.uid);
            await __resolveUserTier(user);
          } else {
            window.__userTier = null;
            window.__isAdmin = false;
          }
          window.__currentUser = user;
          if (!settled) {
            settled = true;
            resolve(user);
          }
        });
      });
    </script>

      const TRACKER_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">\n    \n    <title>Poker Track Pro</title>\n    <meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n    <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n    <meta name=\"theme-color\" content=\"#0f172a\">\n    \n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap\" rel=\"stylesheet\">\n    \n    <style>\n        :root { --bg-dark: #0f172a; --card-bg: #1e293b; --accent: #3b82f6; }\n        body {\n            font-family: 'Inter', sans-serif;\n            background-color: var(--bg-dark);\n            color: #f8fafc;\n            height: 100vh;\n            display: flex;\n            flex-direction: column;\n            overflow: hidden;\n            touch-action: manipulation;\n            padding-top: env(safe-area-inset-top);\n        }\n        * { -webkit-tap-highlight-color: transparent; user-select: none; }\n        input { user-select: text !important; font-size: 16px !important; }\n        .mono { font-family: 'JetBrains Mono', monospace; }\n        \n        .view { display: none; height: auto; min-height: 100%; flex-direction: column; }\n        .view.active { display: flex; }\n        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }\n\n        .toast {\n            position: fixed;\n            top: 60px;\n            left: 50%;\n            transform: translateX(-50%) translateY(-100px);\n            background: #22c55e;\n            color: white;\n            padding: 10px 20px;\n            border-radius: 99px;\n            font-weight: bold;\n            font-size: 12px;\n            z-index: 1000;\n      }\n        }\n    </style>\n</head>\n<body>\n\n    <div id=\"toast\" class=\"toast\">Action Successful!</div>\n\n    <!-- Edit Player Roster Modal -->\n    <div id=\"roster-edit-modal\" class=\"modal-overlay\">\n        <div class=\"bg-slate-800 w-full max-w-md rounded-3xl p-6 border border-slate-700 shadow-2xl space-y-5 max-h-[85vh] flex flex-col\">\n            <div>\n                <h3 class=\"text-lg font-bold\">Edit Player</h3>\n                <p class=\"text-xs text-slate-400\">Renaming will update all history</p>\n            </div>\n            <div class=\"space-y-4\">\n                <input id=\"edit-roster-name-input\" type=\"text\" class=\"w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 text-slate-100\">\n            </div>\n            <div class=\"flex gap-3 pt-4 border-t border-slate-700 shrink-0\">\n                <button onclick=\"window.deleteFromRoster()\" class=\"px-4 py-3 rounded-xl font-bold text-red-400 bg-red-500/10 hover:bg-red-500/20 transition-colors\">Delete</button>\n                <div class=\"flex-grow\"></div>\n                <button onclick=\"window.closeRosterModal()\" class=\"px-6 py-3 rounded-xl font-bold text-slate-400 bg-slate-700/50\">Cancel</button>\n                <button onclick=\"window.saveRosterName()\" class=\"px-6 py-3 rounded-xl font-bold bg-blue-600 text-white\">Save</button>\n            </div>\n        </div>\n    </div>\n\n    <!-- Edit Session Modal -->\n    <div id=\"history-edit-modal\" class=\"modal-overlay\">\n        <div class=\"bg-slate-800 w-full max-w-md rounded-3xl p-6 border border-slate-700 shadow-2xl space-y-5 max-h-[85vh] flex flex-col\">\n            <div>\n                <h3 class=\"text-lg font-bold\">Edit Session</h3>\n                <p class=\"text-xs text-slate-400\">Modify session data manually</p>\n            </div>\n            <div class=\"space-y-4 overflow-y-auto pr-2\">\n                <div class=\"space-y-1\" button onclick=\"window.closeLateAddModal()\" class=\"w-full py-3 rounded-xl font-bold text-slate-400 bg-slate-700/50\">Done</button></div>\n        </div>\n    </div>\n\n    <header class=\"p-4 flex justify-center items-center border-b border-slate-800 glass shrink-0 z-50\">\n        <div class=\"flex items-center gap-2\">\n            <svg viewBox=\"0 0 32 32\" class=\"w-8 h-8 shrink-0\" style=\"filter: drop-shadow(0 4px 6px rgba(30,64,175,0.3));\">\n                <circle cx=\"16\" cy=\"16\" r=\"14\" fill=\"#2563eb\" stroke=\"#ffffff\" stroke-width=\"2\"/>\n                <circle cx=\"16\" cy=\"16\" r=\"9.5\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"2\" stroke-dasharray=\"3.2 3.2\"/>\n                <circle cx=\"16\" cy=\"16\" r=\"4\" fill=\"#ffffff\"/>\n            </svg>\n            <h1 class=\"text-lg font-extrabold tracking-tight\">Logbook</h1>\n        </div>\n    </header>\n\n    <main class=\"scroll-container\">\n        <!-- Setup View -->\n        <section id=\"view-setup\" class=\"view active p-5 space-y-6\">\n            <div class=\"space-y-4\">\n                <h2 class=\"text-sm font-bold text-slate-500 uppercase tracking-widest\">New Session</h2>\n                <div class=\"bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50\">\n                    <label class=\"block text-xs font-bold text-slate-400 mb-4 uppercase\">Game Mode</label>\n                    <div class=\"grid grid-cols-2 gap-2 bg-slate-900 p-1 rounded-xl\">\n                        <button id=\"mode-cash\" onclick=\"window.setGameMode('cash')\" class=\"py-2.5 rounded-lg text-sm font-bold transition bg-blue-600 text-white shadow-md\">Cash</button>\n                        <button id=\"mode-tourney\" onclick=\"window.setGameMode('tournament')\" class=\"py-2.5 rounded-lg text-sm font-bold transition text-slate-400\">Tournament</button>\n                    </div>\n                </div>\n\n                <div class=\"bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50\">\n                    <label class=\"block text-xs font-bold text-slate-400 mb-2 uppercase\">Link to Invite Event (optional)</label>\n                    <select id=\"invite-link-select\" onchange=\"window.setLinkedInviteEvent(this.value)\" class=\"w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 outline-none text-sm\">\n                        <option value=\"\">None</option>\n                    </select>\n                    <p class=\"text-[10px] text-slate-500 mt-2\">Anyone added to this session gets marked \"Yes\" back on that Invites event automatically. Anyone who said yes there but never gets added here is marked as flaked once you finish.</p>\n                </div>\n                \n                <div class=\"bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50 space-y-4\">\n                    <div class=\"flex justify-between items-center\">\n                        <label class=\"block text-xs font-bold text-slate-400 uppercase\">Manage Roster</label>\n                        <div class=\"flex gap-1\">\n                            <button onclick=\"window.cleanUpRosterDuplicates()\" class=\"text-[10px] font-black uppercase text-orange-500 hover:bg-orange-500/10 px-2 py-1 rounded\">Clean Up Duplicates</button>\n                            <button onclick=\"window.toggleRosterEditMode()\" id=\"roster-edit-toggle\" class=\"text-[10px] font-black uppercase text-blue-500 hover:bg-blue-500/10 px-2 py-1 rounded\">Edit Names</button>\n                        </div>\n                    </div>\n                    <form id=\"setup-add-form\" class=\"flex gap-2\">\n                        <input id=\"player-input\" type=\"text\" placeholder=\"Add new player...\" class=\"flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 outline-none\">\n                        <button type=\"submit\" class=\"bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center font-bold text-2xl\">+</button>\n                    </form>\n                    <input id=\"roster-search\" type=\"text\" placeholder=\"Search roster...\" oninput=\"window.filterRoster(this.value)\" class=\"w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-300 outline-none\">\n                    <div id=\"roster-list\" class=\"grid grid-cols-2 sm:grid-cols-3 gap-2 min-h-[40px] content-start\"></div>\n                    <p id=\"roster-count\" class=\"text-[10px] text-slate-500 uppercase tracking-widest text-right\"></p>\n                </div>\n\n                <div class=\"flex justify-between items-center px-1\">\n                    <h3 class=\"text-sm font-bold text-slate-500 uppercase tracking-widest\">Session Participants</h3>\n                    <span id=\"selected-count\" class=\"text-[10px] bg-slate-800 px-2 py-0.5 rounded-full text-slate-400\">0 selected</span>\n                </div>\n            </div>\n            <button id=\"start-btn\" class=\"w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg shadow-xl shadow-blue-900/30\">Start Session</button>\n        </section>\n\n        <!-- Live View -->\n        <section id=\"view-game\" class=\"view p-5 space-y-6\">\n            <div class=\"flex items-center justify-between gap-4\">\n                <div class=\"flex-grow relative\">\n                    <input type=\"text\" id=\"session-title-input\" class=\"text-2xl font-black text-slate-100 bg-transparent w-full outline-none border-b-2 border-dashed border-slate-600 focus:border-blue-500 pb-1 pr-7 transition-colors\" value=\"Live Session\">\n                    <svg class=\"w-4 h-4 text-slate-500 absolute right-0 top-2 pointer-events-none\" fill=\"currentColor\" viewBox=\"0 0 24 24\"><path d=\"M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z\"/></svg>\n                    <p id=\"game-date-display\" class=\"text-xs text-slate-500 font-medium mt-1\"></p>\n                </div>\n                <span id=\"game-mode-badge\" class=\"px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-500 text-[10px] font-black uppercase tracking-widest\"></span>\n            </div>\n            <button onclick=\"window.openLateAddModal()\" class=\"w-full py-3 bg-slate-800/40 border border-dashed border-slate-600 rounded-2xl text-slate-400 font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2\">+ Add Player</button>\n            <div id=\"active-players-list\" class=\"space-y-3\"></div>\n            <div class=\"bg-slate-900 p-5 rounded-3xl border border-slate-800 shadow-2xl space-y-4\">\n                <div class=\"grid grid-cols-2 gap-4\">\n                    <div><span class=\"text-[10px] font-bold text-slate-500 uppercase block mb-1\">Pot</span><span id=\"total-in\" class=\"text-xl font-black mono text-blue-400\">$0</span></div>\n                    <div class=\"text-right\"><span class=\"text-[10px] font-bold text-slate-500 uppercase block mb-1\">Settled</span><span id=\"total-out\" class=\"text-xl font-black mono text-green-400\">$0</span></div>\n                </div>\n                <div id=\"balance-status\" class=\"p-3 rounded-xl flex items-center justify-center gap-2 bg-slate-800/50 border border-slate-700/50\">\n                    <div id=\"status-icon\" class=\"w-2 h-2 rounded-full bg-slate-600\"></div>\n                    <span id=\"status-text\" class=\"text-[11px] font-bold uppercase tracking-wider text-slate-500\">Awaiting Cash-outs</span>\n                </div>\n            </div>\n            <div class=\"grid grid-cols-2 gap-3\">\n                <button onclick=\"window.saveProgress()\" class=\"w-full bg-slate-700 text-white py-4 rounded-2xl font-bold border border-slate-600\">Save</button>\n                <button onclick=\"window.finishGame()\" class=\"w-full bg-slate-100 text-slate-900 py-4 rounded-2xl font-bold\">Finish</button>\n            </div>\n        </section>\n\n        <!-- History View -->\n        <section id=\"view-history\" class=\"view p-5 space-y-6\">\n            <h2 class=\"text-2xl font-black text-slate-100\">History</h2>\n            <div id=\"sessions-list\" class=\"space-y-3\"></div>\n        </section>\n\n        <!-- Stats View -->\n        <section id=\"view-stats\" class=\"view p-5 space-y-6\">\n            <h2 class=\"text-2xl font-black text-slate-100\">Stats</h2>\n            <div class=\"flex flex-wrap gap-2\">\n                <button onclick=\"window.exportToCSV()\" class=\"flex-grow bg-slate-700 text-white px-4 py-3 rounded-xl text-xs font-bold\">Download CSV</button>\n                <button onclick=\"document.getElementById('csv-import-input').click()\" class=\"flex-grow bg-blue-600 text-white px-4 py-3 rounded-xl text-xs font-bold\">Import CSV</button>\n                <input type=\"file\" id=\"csv-import-input\" accept=\".csv\" class=\"hidden\" onchange=\"window.importFromCSV(this.files[0]); this.value='';\">\n            </div>\n            <div id=\"player-stats-list\" class=\"space-y-3\"></div>\n        </section>\n    </main>\n\n    <nav class=\"fixed bottom-0 left-0 right-0 glass border-t border-slate-800 px-4 pt-3 flex justify-between items-center z-[150]\">\n        <button onclick=\"window.switchView('setup')\" class=\"nav-btn flex flex-col items-center gap-1 text-blue-500\" data-view=\"setup\"><svg class=\"w-6 h-6\" fill=\"currentColor\" viewBox=\"0 0 24 24\"><path d=\"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z\"/></svg><span class=\"text-[9px] font-bold uppercase\">Setup</span></button>\n        <button onclick=\"window.switchView('game')\" class=\"nav-btn flex flex-col items-center gap-1 text-slate-500\" data-view=\"game\"><div class=\"relative\"><svg class=\"w-6 h-6\" fill=\"currentColor\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"3\" /><path d=\"M7.5 18.5C6.1 17.1 5.3 15.1 5.3 13C5.3 10.9 6.1 8.9 7.5 7.5L8.9 8.9C7.8 10 7.3 11.4 7.3 13C7.3 14.6 7.8 16 8.9 17.1L7.5 18.5ZM16.5 18.5L15.1 17.1C16.2 16 16.7 14.6 16.7 13C16.7 11.4 16.2 10 15.1 8.9L16.5 7.5C17.9 8.9 18.7 10.9 18.7 13C18.7 15.1 17.9 17.1 16.5 18.5Z\" /></svg><div id=\"live-dot\" class=\"absolute -top-0.5 -right-0.5 w-2 h-2 bg-red-500 rounded-full border border-slate-900 hidden live-pulse\"></div></div><span class=\"text-[9px] font-bold uppercase\">Live</span></button>\n        <button onclick=\"window.switchView('history')\" class=\"nav-btn flex flex-col items-center gap-1 text-slate-500\" data-view=\"history\"><svg class=\"w-6 h-6\" fill=\"currentColor\" viewBox=\"0 0 24 24\"><path d=\"M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z\"/></svg><span class=\"text-[9px] font-bold uppercase\">History</span></button>\n        <button onclick=\"window.switchView('stats')\" class=\"nav-btn flex flex-col items-center gap-1 text-slate-500\" data-view=\"stats\"><svg class=\"w-6 h-6\" fill=\"currentColor\" viewBox=\"0 0 24 24\"><path d=\"M16 11V3H8v6H2v12h20V11h-6zm-6-6h4v14h-4V5zm-6 10h4v4H4v-4zm16 4h-4v-8h4v8z\"/></svg><span class=\"text-[9px] font-bold uppercase\">Stats</span></button>\n    </nav>\n\n    <script>\n        let roster = JSON.parse(localStorage.getItem('poker_pro_roster') || '[]');\n        let history = JSON.parse(localStorage.getItem('poker_pro_history') || '[]');\n        let activePlayers = [];\n        let gameMode = 'cash';\n        let linkedInviteEventId = null;\n        let expandedPlayer = null;\n        let expandedHistoryIdx = null;\n        let expandedStatsPlayer = null;\n        let activeMenuIdx = null;\n        let rosterEditMode = false;\n        let currentlyEditingRosterName = null;\n        let currentlyEditingSessionIdx = null;\n        let rosterSearchQuery = '';\n\n        window.filterRoster = (value) => {\n            rosterSearchQuery = value;\n            render();\n        };\n\n        const playerInput = document.getElementById('player-input');\n        const sessionTitleInput = document.getElementById('session-title-input');\n        const rosterList = document.getElementById('roster-list');\n        const toast = document.getElementById('toast');\n        const liveDot = document.getElementById('live-dot');\n\t\t\n\tfunction renderActivePlayers() {\n    const al = document.getElementById('active-players-list');\n    if (al) {\n        al.innerHTML = activePlayers.sort((a,b) => a.name.localeCompare(b.name)).map((p, i) => {\n            const pin = p.buyInHistory.reduce((a, b) => a + b, 0), net = p.cashOut - pin;\n            const chips = p.buyInHistory.map((amt, bIdx) => `<div class=\"bg-blue-500/20 border border-blue-500/30 text-blue-400 text-[9px] px-1.5 py-0.5 rounded font-bold flex items-center gap-1\">$${amt}<span onclick=\"event.stopPropagation(); window.removeBuyIn(${i}, ${bIdx})\">\u00d7</span></div>`).join('');\n            return `\n                <div class=\"bg-slate-800 rounded-2xl border ${expandedPlayer === p.name ? 'border-blue-500' : 'border-slate-700/50'}\">\n                    <div class=\"p-4 flex justify-between items-center\" onclick=\"window.togglePlayerExpand('${p.name}')\">\n                        <div class=\"flex items-center gap-3\"><div class=\"w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-[10px] font-black text-slate-400\">${p.name[0]}</div><div><span class=\"font-bold text-slate-100 block\">${p.name}</span><div class=\"flex gap-1 mt-1 flex-wrap\">${chips}</div></div></div>\n                        <div class=\"flex items-center gap-4\"><span class=\"mono font-bold text-sm ${net >= 0 ? 'text-green-400' : 'text-red-400'}\">${net >= 0 ? '' : ''}$${net}</span><svg class=\"w-4 h-4 text-slate-600 ${expandedPlayer === p.name ? 'rotate-180' : ''}\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M19 9l-7 7-7-7\"></path></svg></div>\n                    </div>\n                    <div class=\"${expandedPlayer === p.name ? 'block' : 'hidden'} p-4 pt-0 space-y-4 border-t border-slate-700/30 mt-2\">\n                        <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-3 pt-4\">\n                            <div class=\"space-y-1\">\n                                <label class=\"text-[9px] font-black text-slate-500 uppercase block\">Add Buy-in</label>\n                                <div class=\"flex gap-1\">\n                                    <input id=\"buyin-input-${i}\" type=\"number\" placeholder=\"\" class=\"flex-grow bg-slate-900 border border-slate-700 rounded-l-xl p-2.5 text-sm mono text-white outline-none\">\n                                    <button onclick=\"window.confirmBuyIn(${i})\" class=\"bg-blue-600 px-3 rounded-r-xl text-white font-bold\">+</button>\n                                </div>\n                            </div>\n                            <div class=\"space-y-1\">\n                                <label class=\"text-[9px] font-black text-slate-500 uppercase block\">Cash-out</label>\n                                <div class=\"flex gap-1\">\n                                    <input id=\"cashout-input-${i}\" type=\"number\" value=\"${p.cashOut || ''}\" oninput=\"window.updateCashOut(${i}, this.value)\" placeholder=\"Final\" class=\"flex-grow bg-slate-900 border border-slate-700 rounded-l-xl p-2.5 text-sm mono text-white outline-none\">\n                                    <button onclick=\"window.confirmCashOut(${i})\" class=\"bg-green-600 px-3 rounded-r-xl text-white font-bold\">\u2713</button>\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                </div>\n            `;\n        }).join('');\n        updateTotals();\n    }\n}\nwindow.confirmBuyIn = function(playerIndex) {\n    const input = document.getElementById(`buyin-input-${playerIndex}`);\n    if (input && input.value) {\n        const amount = parseFloat(input.value) || 0;\n        if (amount > 0) {\n            // Add to buy-in history (adjust if your addBuyIn is different)\n            activePlayers[playerIndex].buyInHistory.push(amount);\n            input.value = '';  // Clear input\n        }\n    }\n    renderActivePlayers();  // Refresh display\n    updateTotals();\n};\n\nwindow.confirmCashOut = function(playerIndex) {\n    const input = document.getElementById(`cashout-input-${playerIndex}`);\n    if (input && input.value) {\n        activePlayers[playerIndex].cashOut = parseFloat(input.value) || 0;\n    }\n    renderActivePlayers();\n    updateTotals();\n};\n\n\n\n        function showToast(msg) {\n            toast.innerText = msg;\n            toast.classList.add('show');\n            setTimeout(() => toast.classList.remove('show'), 2000);\n        }\n\n        function saveState() {\n            localStorage.setItem('poker_pro_roster', JSON.stringify(roster));\n            localStorage.setItem('poker_pro_history', JSON.stringify(history));\n        }\n\n        // --- ROSTER MANAGEMENT ---\n\n        // Shared name-matching helpers -- used both for cleaning up roster\n        // duplicates and for deciding whether a player joining a live game is\n        // already a known Contact before auto-creating one.\n        const normalizeName = (name) => name\n            .replace(/\\(.*?\\)/g, '')\n            .replace(/\\s+/g, ' ')\n            .trim()\n            .toLowerCase();\n\n        const levenshteinDistance = (a, b) => {\n            const m = a.length, n = b.length;\n            const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));\n            for (let i = 0; i <= m; i++) dp[i][0] = i;\n            for (let j = 0; j <= n; j++) dp[0][j] = j;\n            for (let i = 1; i <= m; i++) {\n                for (let j = 1; j <= n; j++) {\n                    dp[i][j] = a[i - 1] === b[j - 1]\n                        ? dp[i - 1][j - 1]\n                        : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);\n                }\n            }\n            return dp[m][n];\n        };\n\n        const isCloseMatch = (nameA, nameB) => {\n            const a = normalizeName(nameA), b = normalizeName(nameB);\n            if (!a || !b) return false;\n            if (a === b) return true;\n            if (a.includes(b) || b.includes(a)) return true;\n            const maxLen = Math.max(a.length, b.length);\n            if (maxLen < 5) return false;\n            return levenshteinDistance(a, b) <= 2;\n        };\n\n        // Whenever someone joins a live game and isn't already a known Contact\n        // (matched fuzzily, so \"Jon Gillet\" won't create a second entry next to\n        // \"Jon Gillett (Falls Grove)\"), this quietly creates a blank Contact for\n        // them -- name only, phone/email left empty -- so they're ready to invite\n        // (and start building attendance stats) next time without you having to\n        // remember to add them manually.\n        function addNameToContactsIfMissing(name) {\n            let contactsList = [];\n            try { contactsList = JSON.parse(localStorage.getItem('pokerAppContacts') || '[]'); }\n            catch (e) { contactsList = []; }\n\n            const alreadyExists = contactsList.some(c => isCloseMatch(c.name, name));\n            if (alreadyExists) return;\n\n            contactsList.push({\n                id: Date.now().toString() + Math.random().toString(36).slice(2, 6),\n                name: name.trim(),\n                phone: '',\n                email: ''\n            });\n            localStorage.setItem('pokerAppContacts', JSON.stringify(contactsList));\n        }\n\n        // Cleans up near-duplicate roster names (e.g. \"Jon Gillet\" vs \"Jon Gillett\n        // (Falls Grove)\") by matching against the Contacts list from the Invites\n        // feature (same shared storage, same origin). Whichever name matches a\n        // Contact wins; any other roster entries that are a close match get merged\n        // into it -- including renaming their past history entries, so stats keep\n        // rolling up under one name instead of splitting/disappearing.\n        window.cleanUpRosterDuplicates = () => {\n            let contactsList = [];\n            try { contactsList = JSON.parse(localStorage.getItem('pokerAppContacts') || '[]'); }\n            catch (e) { contactsList = []; }\n\n            if (!contactsList.length) { showToast('No Contacts found to match against'); return; }\n\n            const renameMap = {}; // lowercased old roster name -> canonical contact name\n            contactsList.forEach(contact => {\n                const contactName = contact.name.trim();\n                roster.forEach(rosterName => {\n                    if (rosterName !== contactName && isCloseMatch(rosterName, contactName)) {\n                        renameMap[rosterName.toLowerCase()] = contactName;\n                    }\n                });\n            });\n\n            const mergedCount = Object.keys(renameMap).length;\n            if (!mergedCount) { showToast('No duplicates found'); return; }\n\n            if (!confirm(`Found ${mergedCount} duplicate name(s) to merge into your Contacts' spelling. This also updates past session history to match. Continue?`)) return;\n\n            // Rename matching player entries in past history so stats stay intact.\n            history.forEach(session => {\n                session.players.forEach(p => {\n                    const canonical = renameMap[p.name.trim().toLowerCase()];\n                    if (canonical) p.name = canonical;\n                });\n            });\n\n            // Remove the redundant roster entries, keeping the canonical spelling.\n            Object.entries(renameMap).forEach(([oldLower, canonicalName]) => {\n                roster = roster.filter(r => r.toLowerCase() !== oldLower);\n                if (!roster.includes(canonicalName)) roster.push(canonicalName);\n            });\n            roster.sort();\n\n            saveState();\n            render();\n            renderHistory();\n            renderStats();\n            showToast(`Merged ${mergedCount} duplicate name(s)`);\n        };\n\n        window.toggleRosterEditMode = () => {\n            rosterEditMode = !rosterEditMode;\n            const btn = document.getElementById('roster-edit-toggle');\n            btn.innerText = rosterEditMode ? 'Done Editing' : 'Edit Names';\n            btn.classList.toggle('text-green-500', rosterEditMode);\n            btn.classList.toggle('text-blue-500', !rosterEditMode);\n            render();\n        };\n\n        window.openRosterEdit = (name) => {\n            currentlyEditingRosterName = name;\n            document.getElementById('edit-roster-name-input').value = name;\n            document.getElementById('roster-edit-modal').classList.add('active');\n        };\n\n        window.closeRosterModal = () => {\n            document.getElementById('roster-edit-modal').classList.remove('active');\n            currentlyEditingRosterName = null;\n        };\n\n        window.saveRosterName = () => {\n            const newName = document.getElementById('edit-roster-name-input').value.trim();\n            if (!newName || newName === currentlyEditingRosterName) { closeRosterModal(); return; }\n            if (roster.includes(newName)) { showToast(\"Name already exists\"); return; }\n            const rIdx = roster.indexOf(currentlyEditingRosterName);\n            if (rIdx > -1) roster[rIdx] = newName;\n            roster.sort();\n            \n            // Update historical names\n            history.forEach(session => { session.players.forEach(p => { if (p.name === currentlyEditingRosterName) p.name = newName; }); });\n            // Update active session names\n            activePlayers.forEach(p => { if (p.name === currentlyEditingRosterName) p.name = newName; });\n            \n            saveState(); closeRosterModal(); render(); showToast(\"Player updated everywhere\");\n        };\n\n        window.deleteFromRoster = () => {\n            if (!currentlyEditingRosterName) return;\n            // Confirm deletion\n            const confirmMsg = `Permanently delete \"${currentlyEditingRosterName}\" from roster?\\n\\nThis won't delete past game history, but they will be removed from the current setup.`;\n            \n            if (confirm(confirmMsg)) {\n                // Filter out from roster array\n                roster = roster.filter(n => n !== currentlyEditingRosterName);\n                // Filter out from active session selection\n                activePlayers = activePlayers.filter(p => p.name !== currentlyEditingRosterName);\n                \n                saveState(); \n                closeRosterModal(); \n                render(); \n                showToast(\"Player removed from roster\");\n            }\n        };\n\n        // --- NAVIGATION ---\n        window.switchView = (id) => {\n            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));\n            document.getElementById(`view-${id}`).classList.add('active');\n            document.querySelectorAll('.nav-btn').forEach(b => {\n                const isActive = b.dataset.view === id;\n                b.classList.toggle('text-blue-500', isActive);\n                b.classList.toggle('text-slate-500', !isActive);\n            });\n            if (id === 'history') renderHistory();\n            if (id === 'stats') renderStats();\n            if (id === 'game') render();\n            if (id === 'setup') { render(); populateInviteEventDropdown(); }\n        };\n\n        document.getElementById('setup-add-form').onsubmit = (e) => {\n            e.preventDefault();\n            const name = playerInput.value.trim();\n            if (!name) return;\n            if (!roster.includes(name)) { roster.push(name); roster.sort(); }\n            if (!activePlayers.find(p => p.name === name)) activePlayers.push({ name, buyInHistory: [], cashOut: 0 });\n            playerInput.value = ''; saveState(); render();\n        };\n\n        window.toggleSelect = (name) => {\n            if (rosterEditMode) { window.openRosterEdit(name); return; }\n            const idx = activePlayers.findIndex(p => p.name === name);\n            if (idx > -1) activePlayers.splice(idx, 1);\n            else activePlayers.push({ name, buyInHistory: [], cashOut: 0 });\n            render();\n        };\n\n        window.setGameMode = (mode) => {\n            gameMode = mode;\n            document.getElementById('mode-cash').className = `py-2.5 rounded-lg text-sm font-bold transition ${mode === 'cash' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400'}`;\n            document.getElementById('mode-tourney').className = `py-2.5 rounded-lg text-sm font-bold transition ${mode === 'tournament' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400'}`;\n        };\n\n        // --- Linking a session to an Invites event ---\n        // The Invites feature (in the parent app) stores its data under\n        // 'pokerAppInvites' in the same shared browser storage, so we can read and\n        // write it directly from here without any special plumbing.\n        function getInviteEvents() {\n            try { return JSON.parse(localStorage.getItem('pokerAppInvites') || '[]'); }\n            catch (e) { return []; }\n        }\n        function saveInviteEvents(evts) {\n            localStorage.setItem('pokerAppInvites', JSON.stringify(evts));\n        }\n        function populateInviteEventDropdown() {\n            const select = document.getElementById('invite-link-select');\n            if (!select) return;\n            const evts = getInviteEvents();\n            const options = ['<option value=\"\">None</option>'].concat(\n                evts.map(e => `<option value=\"${e.id}\"${e.id === linkedInviteEventId ? ' selected' : ''}>${e.title}${e.date ? ' - ' + e.date : ''}</option>`)\n            );\n            select.innerHTML = options.join('');\n        }\n        // Picking a linked event also auto-selects everyone who said \"Yes\" there,\n        // straight into the live roster selection -- so you can jump right to\n        // \"Start Session\" instead of re-picking everyone by hand. This only adds\n        // people; switching the dropdown never removes anyone you've already\n        // selected, in case you'd adjusted things manually.\n        window.setLinkedInviteEvent = (id) => {\n            linkedInviteEventId = id || null;\n            if (!linkedInviteEventId) return;\n            const evts = getInviteEvents();\n            const evt = evts.find(e => e.id === linkedInviteEventId);\n            if (!evt) return;\n            const yesNames = evt.invitees.filter(i => i.status === 'yes').map(i => i.name.trim()).filter(Boolean);\n            yesNames.forEach(name => {\n                if (!roster.includes(name)) roster.push(name);\n                if (!activePlayers.find(p => p.name === name)) activePlayers.push({ name, buyInHistory: [], cashOut: 0 });\n            });\n            if (yesNames.length) {\n                roster.sort();\n                saveState();\n                render();\n                showToast(`Selected ${yesNames.length} confirmed guest(s)`);\n            }\n        };\n\n        // Marks the given names as \"Yes\" (came) on the linked Invites event --\n        // called the moment someone actually gets added to the live game.\n        function markInviteesAsCame(names) {\n            if (!linkedInviteEventId || !names.length) return;\n            const evts = getInviteEvents();\n            const idx = evts.findIndex(e => e.id === linkedInviteEventId);\n            if (idx === -1) return;\n            const lowerNames = names.map(n => n.trim().toLowerCase());\n            evts[idx] = {\n                ...evts[idx],\n                invitees: evts[idx].invitees.map(inv =>\n                    lowerNames.includes(inv.name.trim().toLowerCase())\n                        ? { ...inv, status: 'yes', attended: null }\n                        : inv\n                )\n            };\n            saveInviteEvents(evts);\n        }\n\n        // Called when the game finishes: anyone who said \"Yes\" on the linked event\n        // gets marked flaked unless they actually showed up AND bought in for real\n        // -- someone toggled into the session but who never put any money in (a\n        // $0 total buy-in) reads the same as a no-show. This runs every time a\n        // linked session finishes, including after a Reopen + correction, so it\n        // deliberately un-flakes someone too if a fixed buy-in now shows they\n        // really played -- not just a one-way flag.\n        function finalizeInviteAttendance() {\n            if (!linkedInviteEventId) return;\n            const evts = getInviteEvents();\n            const idx = evts.findIndex(e => e.id === linkedInviteEventId);\n            if (idx === -1) return;\n            const presentWithBuyIn = new Set(\n                activePlayers\n                    .filter(p => p.buyInHistory.reduce((a, b) => a + b, 0) > 0)\n                    .map(p => p.name.trim().toLowerCase())\n            );\n            evts[idx] = {\n                ...evts[idx],\n                invitees: evts[idx].invitees.map(inv => {\n                    if (inv.status !== 'yes') return inv;\n                    const reallyPlayed = presentWithBuyIn.has(inv.name.trim().toLowerCase());\n                    return { ...inv, attended: reallyPlayed ? null : false };\n                })\n            };\n            saveInviteEvents(evts);\n        }\n\n        document.getElementById('start-btn').onclick = () => {\n            if (!activePlayers.length) return;\n            sessionTitleInput.value = `Session ${new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;\n            document.getElementById('game-date-display').innerText = new Date().toLocaleDateString();\n            document.getElementById('game-mode-badge').innerText = gameMode;\n            liveDot.classList.remove('hidden');\n            markInviteesAsCame(activePlayers.map(p => p.name));\n            activePlayers.forEach(p => addNameToContactsIfMissing(p.name));\n            window.switchView('game');\n        };\n\n        // --- LATE ADD ---\n        window.openLateAddModal = () => {\n            const rosterContainer = document.getElementById('late-roster-list');\n            const unselected = roster.filter(name => !activePlayers.some(p => p.name === name));\n            rosterContainer.innerHTML = unselected.map(name => `\n                <button onclick=\"window.addFromLateRoster('${name}')\" class=\"px-4 py-2 rounded-xl text-xs font-bold bg-slate-700/50 border border-slate-600 text-slate-300\">+ ${name}</button>\n            `).join('') || '<p class=\"text-[10px] text-slate-500 italic\">No available players.</p>';\n            document.getElementById('late-add-modal').classList.add('active');\n        };\n        window.closeLateAddModal = () => document.getElementById('late-add-modal').classList.remove('active');\n        window.addFromLateRoster = (name) => {\n            if (!activePlayers.find(p => p.name === name)) { activePlayers.push({ name, buyInHistory: [], cashOut: 0 }); markInviteesAsCame([name]); addNameToContactsIfMissing(name); render(); window.openLateAddModal(); }\n        };\n        window.addBrandNewPlayer = () => {\n            const input = document.getElementById('late-player-input');\n            const name = input.value.trim();\n            if (!name) return;\n            if (!roster.includes(name)) { roster.push(name); roster.sort(); }\n            if (!activePlayers.find(p => p.name === name)) { activePlayers.push({ name, buyInHistory: [], cashOut: 0 }); markInviteesAsCame([name]); addNameToContactsIfMissing(name); saveState(); render(); input.value = ''; window.openLateAddModal(); }\n        };\n\n        // --- LIVE GAME LOGIC ---\n        window.togglePlayerExpand = (name) => { expandedPlayer = (expandedPlayer === name) ? null : name; render(); };\n        \n\n\n\n        window.removeBuyIn = (pIdx, bIdx) => { activePlayers[pIdx].buyInHistory.splice(bIdx, 1); render(); };\n        window.updateCashOut = (idx, val) => { activePlayers[idx].cashOut = parseInt(val) || 0; updateTotals(); };\n\n        function updateTotals() {\n            let tin = 0, tout = 0;\n            activePlayers.forEach(p => { tin += p.buyInHistory.reduce((a, b) => a + b, 0); tout += p.cashOut; });\n            const ti = document.getElementById('total-in');\n            const to = document.getElementById('total-out');\n            if(ti) ti.innerText = `$${tin}`;\n            if(to) to.innerText = `$${tout}`;\n            \n            const sText = document.getElementById('status-text'), sIcon = document.getElementById('status-icon');\n            if (sText && sIcon) {\n                if (tout === 0) { sText.innerText = \"Awaiting Cash-outs\"; sIcon.className = \"w-2 h-2 rounded-full bg-slate-600\"; }\n                else if (tin === tout) { sText.innerText = \"Balanced\"; sIcon.className = \"w-2 h-2 rounded-full bg-green-500 animate-pulse\"; }\n                else { sText.innerText = (tout > tin) ? `Short $${tout - tin}` : `Surplus $${tin - tout}`; sIcon.className = `w-2 h-2 rounded-full ${(tout > tin) ? 'bg-red-500' : 'bg-blue-500 animate-pulse'}`; }\n            }\n        }\n\n        // Persist the in-progress live game so it survives a refresh/accidental close.\n        function saveActiveSessionCheckpoint() {\n            if (!activePlayers.length) return;\n            localStorage.setItem('poker_pro_active_session', JSON.stringify({\n                title: sessionTitleInput.value.trim(),\n                mode: gameMode,\n                dateDisplay: document.getElementById('game-date-display') ? document.getElementById('game-date-display').innerText : '',\n                players: activePlayers,\n                linkedInviteEventId\n            }));\n        }\n\n        function clearActiveSessionCheckpoint() {\n            localStorage.removeItem('poker_pro_active_session');\n        }\n\n        // \"Save\" -- checkpoints current progress, keeps the game live so play continues.\n        window.saveProgress = () => {\n            if (!activePlayers.length) { showToast(\"Nothing to save yet\"); return; }\n            saveActiveSessionCheckpoint();\n            showToast(\"Progress saved\");\n        };\n\n        // \"Finish\" -- ends the game for good: records it to history and clears the live session.\n        window.finishGame = () => {\n            if (!activePlayers.length) return;\n            finalizeInviteAttendance();\n            history.unshift({\n                id: Date.now(), title: sessionTitleInput.value.trim(),\n                date: new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }),\n                mode: gameMode, pot: activePlayers.reduce((sum, p) => sum + p.buyInHistory.reduce((a,b)=>a+b, 0), 0),\n                totalOut: activePlayers.reduce((sum, p) => sum + p.cashOut, 0), players: JSON.parse(JSON.stringify(activePlayers)),\n                linkedInviteEventId\n            });\n            saveState(); activePlayers = []; linkedInviteEventId = null; liveDot.classList.add('hidden'); clearActiveSessionCheckpoint(); window.switchView('history');\n        };\n\n        // --- HISTORY ---\n        window.toggleHistoryExpand = (idx) => { expandedHistoryIdx = (expandedHistoryIdx === idx) ? null : idx; renderHistory(); };\n        window.toggleActionMenu = (e, idx) => { e.stopPropagation(); activeMenuIdx = (activeMenuIdx === idx) ? null : idx; renderHistory(); };\n        window.deleteSession = (e, idx) => { e.stopPropagation(); if (confirm(\"Delete this session?\")) { history.splice(idx, 1); saveState(); activeMenuIdx = null; renderHistory(); } };\n\n        // Moves a finished session back into a live game -- for when it got\n        // finished by mistake, or something (a buy-in, a name) needs fixing that's\n        // easier to correct live than by editing the history entry directly.\n        // Restores the original linked Invites event (if there was one) so that\n        // finishing it again correctly re-checks attendance/flake status against\n        // the corrected data -- including un-flaking someone if a fixed buy-in\n        // now shows they genuinely played.\n        window.reopenSession = (e, idx) => {\n            e.stopPropagation();\n            const session = history[idx];\n            if (!session) return;\n\n            const confirmMsg = activePlayers.length > 0\n                ? `You already have a live session in progress. Reopening \"${session.title}\" will replace it (anything already saved to History stays safe either way). Continue?`\n                : `Reopen \"${session.title}\" as a live session?`;\n            if (!confirm(confirmMsg)) return;\n\n            activePlayers = JSON.parse(JSON.stringify(session.players));\n            gameMode = session.mode || 'cash';\n            linkedInviteEventId = session.linkedInviteEventId || null;\n            sessionTitleInput.value = session.title;\n            const dateDisplayEl = document.getElementById('game-date-display');\n            if (dateDisplayEl) dateDisplayEl.innerText = session.date;\n            const modeBadgeEl = document.getElementById('game-mode-badge');\n            if (modeBadgeEl) modeBadgeEl.innerText = gameMode;\n            liveDot.classList.remove('hidden');\n\n            history.splice(idx, 1);\n            activeMenuIdx = null;\n            saveState();\n            saveActiveSessionCheckpoint();\n            render();\n            renderHistory();\n            window.switchView('game');\n            showToast('Session reopened');\n        };\n        \n        window.openHistoryEdit = (e, idx) => {\n            e.stopPropagation();\n            currentlyEditingSessionIdx = idx;\n            const session = history[idx];\n            document.getElementById('edit-session-title').value = session.title;\n            const container = document.getElementById('edit-session-players');\n            container.innerHTML = session.players.map((p, pIdx) => `\n                <div class=\"space-y-2 p-3 bg-slate-900 rounded-xl border border-slate-700/50\">\n                    <span class=\"font-bold text-slate-300 text-xs\">${p.name}</span>\n                    <div class=\"grid grid-cols-2 gap-2\">\n                        <div><label class=\"text-[8px] uppercase text-slate-500 font-bold block\">Buy-in</label>\n                        <input id=\"edit-p-buyin-${pIdx}\" type=\"number\" value=\"${p.buyInHistory.reduce((a,b)=>a+b, 0)}\" class=\"w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm mono\"></div>\n                        <div><label class=\"text-[8px] uppercase text-slate-500 font-bold block\">Cash-out</label>\n                        <input id=\"edit-p-cashout-${pIdx}\" type=\"number\" value=\"${p.cashOut}\" class=\"w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm mono\"></div>\n                    </div>\n                </div>\n            `).join('');\n            document.getElementById('history-edit-modal').classList.add('active');\n            activeMenuIdx = null;\n            renderHistory();\n        };\n\n        window.closeHistoryModal = () => {\n            document.getElementById('history-edit-modal').classList.remove('active');\n            currentlyEditingSessionIdx = null;\n        };\n\n        window.saveSessionEdit = () => {\n            const s = history[currentlyEditingSessionIdx];\n            s.title = document.getElementById('edit-session-title').value.trim();\n            s.players.forEach((p, pIdx) => {\n                const buyIn = parseInt(document.getElementById(`edit-p-buyin-${pIdx}`).value) || 0;\n                const cashOut = parseInt(document.getElementById(`edit-p-cashout-${pIdx}`).value) || 0;\n                p.buyInHistory = [buyIn]; \n                p.cashOut = cashOut;\n            });\n            s.pot = s.players.reduce((sum, p) => sum + p.buyInHistory[0], 0);\n            s.totalOut = s.players.reduce((sum, p) => sum + p.cashOut, 0);\n            saveState(); closeHistoryModal(); renderHistory(); showToast(\"Session updated\");\n        };\n\n        // --- STATS PERFORMANCE CHART ---\n        function generatePerformanceChart(playerData) {\n            if (playerData.length < 2) return '';\n            \n            let cumulative = 0;\n            const points = [...playerData].reverse().map(p => {\n                const net = p.cashOut - p.buyInHistory.reduce((a,b)=>a+b, 0);\n                cumulative += net;\n                return cumulative;\n            });\n\n            const max = Math.max(...points, 0);\n            const min = Math.min(...points, 0);\n            const range = max - min || 100;\n            const height = 60;\n            const width = 280;\n            const padding = 10;\n            \n            const coords = points.map((p, i) => {\n                const x = (i / (points.length - 1)) * (width - (padding * 2)) + padding;\n                const y = height - (((p - min) / range) * (height - (padding * 2)) + padding);\n                return `${x},${y}`;\n            }).join(' ');\n\n            const color = points[points.length-1] >= 0 ? '#4ade80' : '#f87171';\n\n            return `\n                <div class=\"mt-4 pt-4 border-t border-slate-700/30\">\n                    <span class=\"text-[8px] text-slate-500 font-black uppercase block mb-2 tracking-widest\">Performance Curve</span>\n                    <div class=\"w-full flex justify-center bg-slate-900/60 rounded-xl p-2\">\n                        <svg width=\"${width}\" height=\"${height}\" class=\"overflow-visible\">\n                            <line x1=\"0\" y1=\"${height - (((0 - min) / range) * (height - (padding * 2)) + padding)}\" x2=\"${width}\" y2=\"${height - (((0 - min) / range) * (height - (padding * 2)) + padding)}\" stroke=\"#334155\" stroke-dasharray=\"3,3\" />\n                            <polyline points=\"${coords}\" class=\"performance-path\" stroke=\"${color}\" />\n                            <circle cx=\"${coords.split(' ').pop().split(',')[0]}\" cy=\"${coords.split(' ').pop().split(',')[1]}\" r=\"3\" fill=\"${color}\" />\n                        </svg>\n                    </div>\n                </div>\n            `;\n        }\n\n        // --- RENDERING ---\n        function render() {\n            // Render Roster List (Setup View)\n            if (rosterList) {\n                const query = rosterSearchQuery.trim().toLowerCase();\n                const filtered = query ? roster.filter(n => n.toLowerCase().includes(query)) : roster;\n                rosterList.innerHTML = filtered.map(n => {\n                    const isSelected = activePlayers.some(p => p.name === n);\n                    return `<button onclick=\"window.toggleSelect('${n}')\" class=\"px-4 py-2 rounded-xl text-xs font-bold border transition flex items-center gap-2 justify-center ${isSelected ? 'bg-blue-600 border-blue-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}\">${n}${rosterEditMode ? ' \u270e' : ''}</button>`;\n                }).join('') || '<p class=\"col-span-full text-center text-xs text-slate-600 italic py-2\">No matching names</p>';\n\n                const countEl = document.getElementById('roster-count');\n                if (countEl) countEl.innerText = query ? `${filtered.length} of ${roster.length} shown` : `${roster.length} in roster`;\n            }\n            \n            const selCount = document.getElementById('selected-count');\n            if (selCount) selCount.innerText = `${activePlayers.length} selected`;\n            \n            // Render Active Players (Game View)\n             renderActivePlayers();\n        }\n\n        function renderHistory() {\n            const container = document.getElementById('sessions-list');\n            if (!container) return;\n            container.innerHTML = history.map((s, idx) => {\n                const isExp = expandedHistoryIdx === idx, isMenu = activeMenuIdx === idx;\n                const pRows = s.players.map(p => {\n                    const pin = p.buyInHistory.reduce((a,b)=>a+b,0), net = p.cashOut - pin;\n                    return `<div class=\"flex justify-between py-1.5 border-b border-slate-700/30 text-[11px]\"><span class=\"text-slate-300 font-bold\">${p.name}</span><span class=\"mono ${net >= 0 ? 'text-green-500' : 'text-red-400'} font-black\">${net >= 0 ? '+' : ''}${net}</span></div>`;\n                }).join('');\n                return `\n                    <div class=\"bg-slate-800 rounded-2xl border relative ${isExp ? 'border-blue-500' : 'border-slate-700/50'}\" onclick=\"window.toggleHistoryExpand(${idx})\">\n                        <div class=\"p-4 flex justify-between items-start gap-3\">\n                            <div class=\"flex-1 min-w-0\"><h4 class=\"text-sm font-bold break-words\">${s.title}</h4><p class=\"text-[10px] text-slate-500\">${s.date} \u2022 $${s.pot} Pot</p></div>\n                            <div class=\"flex items-center gap-2 shrink-0\">\n                                <button onclick=\"window.toggleActionMenu(event, ${idx})\" class=\"p-2\"><svg class=\"w-4 h-4 text-slate-400\" fill=\"currentColor\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"5\" r=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2\"/><circle cx=\"12\" cy=\"19\" r=\"2\"/></svg></button>\n                            </div>\n                        </div>\n                        <div class=\"action-menu ${isMenu ? '' : 'hidden'}\">\n                            <button onclick=\"window.reopenSession(event, ${idx})\" class=\"w-full text-left px-4 py-3 text-[11px] font-bold text-green-400 border-b border-slate-700/50\">Reopen</button>\n                            <button onclick=\"window.openHistoryEdit(event, ${idx})\" class=\"w-full text-left px-4 py-3 text-[11px] font-bold text-blue-400 border-b border-slate-700/50\">Edit</button>\n                            <button onclick=\"window.deleteSession(event, ${idx})\" class=\"w-full text-left px-4 py-3 text-[11px] font-bold text-red-400\">Delete</button>\n                        </div>\n                        <div class=\"${isExp ? 'block' : 'hidden'} px-4 pb-4 pt-2 bg-slate-900/30 rounded-b-2xl border-t border-slate-700/20\">${pRows}</div>\n                    </div>\n                `;\n            }).join('') || '<p class=\"text-center py-10 italic text-slate-600\">No sessions yet.</p>';\n        }\n\n        window.toggleStatsExpand = (name) => { expandedStatsPlayer = (expandedStatsPlayer === name) ? null : name; renderStats(); };\n\n        function renderStats() {\n            const container = document.getElementById('player-stats-list');\n            if (!container) return;\n            const stats = roster.map(name => {\n                let tin = 0, tout = 0, games = 0;\n                let sessionHistory = [];\n                history.forEach(h => { \n                    const p = h.players.find(x => x.name === name); \n                    if (p) { \n                        tin += p.buyInHistory.reduce((a,b)=>a+b, 0); \n                        tout += p.cashOut; \n                        games++; \n                        sessionHistory.push(p);\n                    } \n                });\n                return { name, tin, tout, games, profit: tout - tin, sessionHistory };\n            }).sort((a,b) => b.profit - a.profit).filter(s => s.games > 0);\n\n            container.innerHTML = stats.map(s => {\n                const avgProfit = Math.round(s.profit / s.games);\n                const isExp = expandedStatsPlayer === s.name;\n                return `\n                    <div class=\"bg-slate-800 rounded-2xl border transition-all ${isExp ? 'border-blue-500 ring-1 ring-blue-500/20' : 'border-slate-700/50'}\" onclick=\"window.toggleStatsExpand('${s.name}')\">\n                        <div class=\"p-4 flex justify-between items-center\">\n                            <div><h4 class=\"text-sm font-bold text-slate-100\">${s.name}</h4><p class=\"text-[10px] text-slate-500 uppercase font-black tracking-tighter\">${s.games} Sessions</p></div>\n                            <div class=\"flex items-center gap-3\">\n                                <span class=\"mono font-black ${s.profit >= 0 ? 'text-green-400' : 'text-red-400'}\">${s.profit >= 0 ? '+' : ''}$${s.profit}</span>\n                                <svg class=\"w-3 h-3 text-slate-600 transform transition ${isExp ? 'rotate-180' : ''}\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\"><path stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2\" d=\"M19 9l-7 7-7-7\"></path></svg>\n                            </div>\n                        </div>\n                        <div class=\"${isExp ? 'block' : 'hidden'} px-4 pb-4 pt-2 border-t border-slate-700/30\">\n                             <div class=\"grid grid-cols-2 gap-4\">\n                                <div class=\"bg-slate-900/40 p-2 rounded-xl border border-slate-700/30\">\n                                    <span class=\"text-[8px] text-slate-500 font-black uppercase block tracking-widest\">Total Buy-in</span>\n                                    <span class=\"text-xs mono font-bold text-blue-400\">$${s.tin}</span>\n                                </div>\n                                <div class=\"bg-slate-900/40 p-2 rounded-xl border border-slate-700/30\">\n                                    <span class=\"text-[8px] text-slate-500 font-black uppercase block tracking-widest\">Total Cashout</span>\n                                    <span class=\"text-xs mono font-bold text-green-400\">$${s.tout}</span>\n                                </div>\n                                <div class=\"bg-slate-900/40 p-2 rounded-xl border border-slate-700/30 col-span-2\">\n                                    <span class=\"text-[8px] text-slate-500 font-black uppercase block tracking-widest\">Avg. Profit / Game</span>\n                                    <span class=\"text-xs mono font-bold ${avgProfit >= 0 ? 'text-green-400' : 'text-red-400'}\">${avgProfit >= 0 ? '+' : ''}$${avgProfit}</span>\n                                </div>\n                             </div>\n                             ${generatePerformanceChart(s.sessionHistory)}\n                        </div>\n                    </div>\n                `;\n            }).join('') || '<p class=\"text-center py-10 italic text-slate-600\">No stats yet.</p>';\n        }\n\n        window.exportToCSV = () => {\n            let csv = \"Date,Session Title,Mode,Player,Total Buy-in,Cash-out,Net Profit\\n\";\n            history.forEach(s => { s.players.forEach(p => { const pin = p.buyInHistory.reduce((a,b)=>a+b,0); csv += `\"${s.date}\",\"${s.title}\",\"${s.mode}\",\"${p.name}\",${pin},${p.cashOut},${p.cashOut-pin}\\n`; }); });\n            const link = document.createElement(\"a\"); link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); link.download = 'poker_stats.csv'; link.click();\n        };\n\n        // Parses a single CSV line, handling quoted fields that may contain commas.\n        function parseCSVLine(line) {\n            const result = [];\n            let cur = '';\n            let inQuotes = false;\n            for (let i = 0; i < line.length; i++) {\n                const ch = line[i];\n                if (inQuotes) {\n                    if (ch === '\"') {\n                        if (line[i + 1] === '\"') { cur += '\"'; i++; }\n                        else { inQuotes = false; }\n                    } else { cur += ch; }\n                } else {\n                    if (ch === '\"') inQuotes = true;\n                    else if (ch === ',') { result.push(cur); cur = ''; }\n                    else cur += ch;\n                }\n            }\n            result.push(cur);\n            return result.map(f => f.trim());\n        }\n\n        // Imports a CSV in the exact format exportToCSV produces, grouping rows back\n        // into sessions (matched by Date + Session Title + Mode) and adding any new\n        // player names to the roster so they show up in Stats too.\n        window.importFromCSV = (file) => {\n            if (!file) return;\n            const reader = new FileReader();\n            reader.onload = (e) => {\n                try {\n                    const text = e.target.result;\n                    const lines = text.split(/\\r?\\n/).filter(l => l.trim().length > 0);\n                    if (!lines.length) { showToast('CSV file is empty'); return; }\n                    lines.shift(); // drop header row\n\n                    const sessionsByKey = {};\n                    let rowsImported = 0;\n\n                    lines.forEach(line => {\n                        const fields = parseCSVLine(line);\n                        if (fields.length < 7) return;\n                        const [date, title, mode, player, buyIn, cashOut] = fields;\n                        if (!date || !player) return;\n\n                        const key = date + '|' + title + '|' + mode;\n                        if (!sessionsByKey[key]) {\n                            sessionsByKey[key] = {\n                                id: Date.now() + Math.random(),\n                                title: title || 'Imported Session',\n                                date: date,\n                                mode: mode || 'cash',\n                                players: []\n                            };\n                        }\n                        const existingMatch = roster.find(r => r.trim().toLowerCase() === player.trim().toLowerCase());\n                        if (!existingMatch) {\n                            roster.push(player);\n                        }\n                        sessionsByKey[key].players.push({\n                            name: existingMatch || player,\n                            buyInHistory: [parseFloat(buyIn) || 0],\n                            cashOut: parseFloat(cashOut) || 0\n                        });\n                        rowsImported++;\n                    });\n\n                    const importedSessions = Object.values(sessionsByKey).map(s => ({\n                        ...s,\n                        pot: s.players.reduce((sum, p) => sum + p.buyInHistory.reduce((a, b) => a + b, 0), 0),\n                        totalOut: s.players.reduce((sum, p) => sum + p.cashOut, 0)\n                    }));\n\n                    if (!importedSessions.length) { showToast('No valid rows found in CSV'); return; }\n\n                    history = [...importedSessions, ...history];\n                    roster.sort();\n                    saveState();\n                    renderHistory();\n                    renderStats();\n                    render();\n                    showToast(`Imported ${importedSessions.length} session(s), ${rowsImported} row(s)`);\n                } catch (err) {\n                    console.error('CSV import failed:', err);\n                    showToast('Import failed -- check the CSV format');\n                }\n            };\n            reader.readAsText(file);\n        };\n\n        window.onclick = (e) => { if (activeMenuIdx !== null) { activeMenuIdx = null; renderHistory(); } };\n        window.onload = () => {\n            populateInviteEventDropdown();\n            const savedActive = localStorage.getItem('poker_pro_active_session');\n            if (savedActive) {\n                try {\n                    const parsed = JSON.parse(savedActive);\n                    if (parsed && Array.isArray(parsed.players) && parsed.players.length) {\n                        activePlayers = parsed.players;\n                        gameMode = parsed.mode || 'cash';\n                        linkedInviteEventId = parsed.linkedInviteEventId || null;\n                        sessionTitleInput.value = parsed.title || 'Live Session';\n                        document.getElementById('game-date-display').innerText = parsed.dateDisplay || new Date().toLocaleDateString();\n                        document.getElementById('game-mode-badge').innerText = gameMode;\n                        liveDot.classList.remove('hidden');\n                        window.switchView('game');\n                        showToast('Resumed your saved game');\n                    }\n                } catch (e) { console.error('Could not restore saved session:', e); }\n            }\n            render(); updateTotals();\n        };\n    <\/script>\n</body>\n</html>";
