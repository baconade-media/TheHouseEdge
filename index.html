                } catch (e) { return []; }
            });
            const [newContactName, setNewContactName] = useState('');
            const [newContactPhone, setNewContactPhone] = useState('');
            const [newContactEmail, setNewContactEmail] = useState('');
            const [editingContactId, setEditingContactId] = useState(null);
            const [contactSearchQuery, setContactSearchQuery] = useState('');
            const [contactSortMode, setContactSortMode] = useState('alpha'); // 'alpha' | 'attendance'
            const [editContactName, setEditContactName] = useState('');
            const [editContactPhone, setEditContactPhone] = useState('');
            const [editContactEmail, setEditContactEmail] = useState('');

            // The Logbook (Tracking tab) and Contacts share the same browser storage
            // (same-origin iframe), so we can read its roster directly -- this keeps
            // the two lists in sync without any extra plumbing or manual "sync" step.
            const [logbookRoster, setLogbookRoster] = useState(() => {
                try { return JSON.parse(localStorage.getItem('poker_pro_roster') || '[]'); } catch (e) { return []; }
            });

            useEffect(() => {
                localStorage.setItem('pokerAppInvites', JSON.stringify(events));
            }, [events]);

            useEffect(() => {
                localStorage.setItem('pokerAppContacts', JSON.stringify(contacts));
            }, [contacts]);

            useEffect(() => {
                if (currentEventId) localStorage.setItem('pokerAppInvitesCurrentEvent', currentEventId);
                else localStorage.removeItem('pokerAppInvitesCurrentEvent');
            }, [currentEventId]);

            // The Logbook can update event attendance (via a linked session) while
            // this tab is sitting in the background -- re-sync from storage whenever
            // this tab becomes the active view again, so those updates show up
            // without needing a full page refresh.
            useEffect(() => {
                if (!isActive) return;
                try {
                    const fresh = JSON.parse(localStorage.getItem('pokerAppInvites') || '[]');
                    setEvents(fresh);
                } catch (e) { /* ignore */ }
            }, [isActive]);

            // Keeps the roster suggestions live while this tab is open, in case a
            // name gets added over in the Logbook in the same session.
            useEffect(() => {
                const refreshRoster = () => {
                    try { setLogbookRoster(JSON.parse(localStorage.getItem('poker_pro_roster') || '[]')); }
                    catch (e) { /* ignore */ }
                };
                refreshRoster();
                window.addEventListener('focus', refreshRoster);
                const interval = setInterval(refreshRoster, 3000);
                return () => { window.removeEventListener('focus', refreshRoster); clearInterval(interval); };
            }, []);

            const currentEvent = events.find(e => e.id === currentEventId);

            const defaultMessage = (title, date) => `Hey! You're invited to ${title}${date ? ' on ' + date : ''}. Let me know if you can make it!`;

            // --- Event management ---
            const createEvent = () => {
                if (!newEventTitle.trim()) return;
                const id = Date.now().toString();
                const event = {
                    id, title: newEventTitle.trim(), date: newEventDate || '', invitees: [],
                    message: defaultMessage(newEventTitle.trim(), newEventDate)
                };
                setEvents(prev => [event, ...prev]);
                setCurrentEventId(id);
                setNewEventTitle('');
                setNewEventDate('');
            };

            const deleteEvent = (id) => {
                setEvents(prev => prev.filter(e => e.id !== id));
                if (currentEventId === id) setCurrentEventId(null);
            };

            const updateCurrentEvent = (updater) => {
                setEvents(prev => prev.map(e => e.id === currentEventId ? updater(e) : e));
            };

            // --- Contact management (persistent, independent of any one event) ---

            // Keeps this in sync with the Logbook the other direction too: any new
            // name added here also gets added to the Logbook's roster (name only --
            // the Logbook roster doesn't store contact info), so it's ready to go
            // next time the Logbook loads.
            const addNameToLogbookRoster = (name) => {
                try {
                    const roster = JSON.parse(localStorage.getItem('poker_pro_roster') || '[]');
                    if (!roster.some(r => r.trim().toLowerCase() === name.trim().toLowerCase())) {
                        roster.push(name.trim());
                        roster.sort((a, b) => a.localeCompare(b));
                        localStorage.setItem('poker_pro_roster', JSON.stringify(roster));
                    }
                } catch (e) {
                    console.error('Could not sync name to Logbook roster:', e);
                }
            };

            const addContact = () => {
                if (!newContactName.trim() || (!newContactPhone.trim() && !newContactEmail.trim())) return;
                const contact = {
                    id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
                    name: newContactName.trim(),
                    phone: newContactPhone.trim(),
                    email: newContactEmail.trim()
                };
                setContacts(prev => [...prev, contact]);
                addNameToLogbookRoster(contact.name);
                setNewContactName('');
                setNewContactPhone('');
                setNewContactEmail('');
            };

            const quickAddContactFromRoster = (name) => {
                setNewContactName(name);
            };

            // The Contact Picker API lets the user pick straight from their phone's
            // native contacts app -- currently supported on Android Chrome/Edge and
            // similar Chromium browsers. Safari/iOS hasn't implemented this API yet,
            // so this is offered as a shortcut where available, not a requirement.
            const contactPickerSupported = typeof navigator !== 'undefined' && 'contacts' in navigator && typeof navigator.contacts?.select === 'function';
            const [pendingImports, setPendingImports] = useState(null); // null | array awaiting review

            // Strips common phone-contact clutter -- "(Falls Grove)", "(Work)", extra
            // spaces -- so "Jon Gillett (Falls Grove)" compares fairly against "Jon Gillett".
            const normalizeName = (name) => name
                .replace(/\(.*?\)/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .toLowerCase();

            // Simple edit-distance check to catch near-misses (typos, "Jon Gillett"
            // vs "Jon Gillet") that a strict comparison would miss.
            const levenshteinDistance = (a, b) => {
                const m = a.length, n = b.length;
                const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
                for (let i = 0; i <= m; i++) dp[i][0] = i;
                for (let j = 0; j <= n; j++) dp[0][j] = j;
                for (let i = 1; i <= m; i++) {
                    for (let j = 1; j <= n; j++) {
                        dp[i][j] = a[i - 1] === b[j - 1]
                            ? dp[i - 1][j - 1]
                            : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
                    }
                }
                return dp[m][n];
            };

            const namesAreCloseMatch = (nameA, nameB) => {
                const a = normalizeName(nameA), b = normalizeName(nameB);
                if (!a || !b) return false;
                if (a === b) return true;
                if (a.includes(b) || b.includes(a)) return true; // one fully contains the other
                // Small edit distance relative to name length = likely the same person,
                // just typed slightly differently. Skip very short names to avoid
                // false positives (e.g. "Al" vs "Ed").
                const maxLen = Math.max(a.length, b.length);
                if (maxLen < 5) return false;
                return levenshteinDistance(a, b) <= 2;
            };

            // Cross-references incoming imports against existing Contacts by name, so
            // the review screen can flag duplicates and default to the sensible
            // choice (skip what's already on file, only add what's genuinely new).
            // matchedContactId records which existing contact to MERGE into, rather
            // than creating a brand new (near-)duplicate entry.
            const enrichWithDuplicateInfo = (rawList) => {
                return rawList.map(item => {
                    const matches = contacts.filter(c => namesAreCloseMatch(c.name, item.name));
                    const hasExistingPhone = matches.some(c => c.phone);
                    const hasExistingEmail = matches.some(c => c.email);
                    return {
                        name: item.name,
                        phones: item.phones,
                        emails: item.emails,
                        selectedPhoneIndex: 0,
                        includePhone: item.phones.length > 0 && !hasExistingPhone,
                        includeEmail: item.emails.length > 0 && !hasExistingEmail,
                        isDuplicate: matches.length > 0,
                        matchedNames: [...new Set(matches.map(m => m.name))],
                        matchedContactId: matches.length > 0 ? matches[0].id : null,
                        hasExistingPhone,
                        hasExistingEmail
                    };
                });
            };

            const importFromPhoneContacts = async () => {
                try {
                    const selected = await navigator.contacts.select(['name', 'tel', 'email'], { multiple: true });
                    if (!selected || !selected.length) return;
                    const raw = selected
                        .map(c => ({
                            name: (c.name && c.name[0]) || 'Unnamed',
                            phones: c.tel || [],
                            emails: c.email || []
                        }))
                        .filter(c => c.phones.length > 0 || c.emails.length > 0); // skip contacts with no usable info
                    if (!raw.length) return;
                    setPendingImports(enrichWithDuplicateInfo(raw));
                } catch (err) {
                    console.error('Contact import cancelled or failed:', err);
                }
            };

            const updatePendingImport = (index, updater) => {
                setPendingImports(prev => prev.map((p, i) => i === index ? updater(p) : p));
            };

            const confirmImport = () => {
                let updatedContacts = [...contacts];
                const namesToSync = [];

                pendingImports.forEach(p => {
                    const phoneToAdd = p.includePhone && p.phones.length > 0 ? (p.phones[p.selectedPhoneIndex] || p.phones[0]) : '';
                    const emailToAdd = p.includeEmail && p.emails.length > 0 ? p.emails[0] : '';
                    if (!phoneToAdd && !emailToAdd) return; // nothing selected for this person

                    if (p.matchedContactId) {
                        // Merge into the existing contact rather than creating a duplicate.
                        updatedContacts = updatedContacts.map(c => c.id === p.matchedContactId
                            ? { ...c, phone: c.phone || phoneToAdd, email: c.email || emailToAdd }
                            : c);
                    } else {
                        updatedContacts.push({
                            id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
                            name: p.name, phone: phoneToAdd, email: emailToAdd
                        });
                    }
                    namesToSync.push(p.name);
                });

                if (namesToSync.length) {
                    setContacts(updatedContacts);
                    namesToSync.forEach(name => addNameToLogbookRoster(name));
                }
                setPendingImports(null);
            };

            const cancelImport = () => setPendingImports(null);

            // --- .vcf (vCard) file import -- the fallback for iPhone, since Safari
            // doesn't support the Contact Picker API. iPhone's Contacts app (or
            // iCloud.com/contacts) can export contacts as a .vcf file, which this
            // parses into the same review screen used for the Android picker above.
            const parseVCardFile = (text) => {
                const cards = text.split(/BEGIN:VCARD/i).slice(1);
                const parsed = [];
                cards.forEach(cardText => {
                    const lines = cardText.split(/\r?\n/);
                    let name = '';
                    const phones = [];
                    const emails = [];
                    lines.forEach(rawLine => {
                        const line = rawLine.trim();
                        if (!line || /^END:VCARD/i.test(line)) return;
                        const colonIdx = line.indexOf(':');
                        if (colonIdx === -1) return;
                        const key = line.slice(0, colonIdx).split(';')[0].toUpperCase();
                        const value = line.slice(colonIdx + 1).trim();
                        if (!value) return;
                        if (key === 'FN' && !name) {
                            name = value;
                        } else if (key === 'N' && !name) {
                            const parts = value.split(';').filter(Boolean);
                            name = parts.slice(0, 2).reverse().join(' ').trim();
                        } else if (key === 'TEL') {
                            phones.push(value);
                        } else if (key === 'EMAIL') {
                            emails.push(value);
                        }
                    });
                    if (phones.length || emails.length) {
                        parsed.push({ name: name || 'Unnamed', phones, emails });
                    }
                });
                return parsed;
            };

            const handleVcfFileSelected = (e) => {
                const file = e.target.files[0];
                e.target.value = ''; // allow re-selecting the same file later
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = parseVCardFile(ev.target.result);
                        if (!parsed.length) {
                            alert("Couldn't find any contacts with a phone number or email in that file.");
                            return;
                        }
                        setPendingImports(enrichWithDuplicateInfo(parsed));
                    } catch (err) {
                        console.error('vCard parse failed:', err);
                        alert("Couldn't read that file -- make sure it's a .vcf contacts file.");
                    }
                };
                reader.readAsText(file);
            };

            const startEditingContact = (c) => {
                setEditingContactId(c.id);
                setEditContactName(c.name);
                setEditContactPhone(c.phone || '');
                setEditContactEmail(c.email || '');
            };

            const saveEditingContact = () => {
                if (!editContactName.trim() || (!editContactPhone.trim() && !editContactEmail.trim())) return;
                setContacts(prev => prev.map(c => c.id === editingContactId
                    ? { ...c, name: editContactName.trim(), phone: editContactPhone.trim(), email: editContactEmail.trim() }
                    : c));
                setEditingContactId(null);
            };

            const cancelEditingContact = () => setEditingContactId(null);

            const deleteContact = (id) => {
                setContacts(prev => prev.filter(c => c.id !== id));
            };

            // --- Selecting who's invited to the current event, straight from Contacts ---
            const isInvited = (contactId) => !!(currentEvent && currentEvent.invitees.some(i => i.contactId === contactId));

            // Tallies a contact's history across every event they've ever been
            // invited to -- powers both the stats shown in the Contacts list and
            // the "Most Regular" sort option.
            const getContactStats = (contactId) => {
                const allInvites = events.flatMap(e => e.invitees.filter(i => i.contactId === contactId));
                const came = allInvites.filter(i => i.status === 'yes' && i.attended !== false).length;
                const flaked = allInvites.filter(i => i.status === 'yes' && i.attended === false).length;
                const declined = allInvites.filter(i => i.status === 'no').length;
                const noResponse = allInvites.filter(i => i.status === 'pending').length;
                return { total: allInvites.length, came, flaked, declined, noResponse };
            };

            const toggleInviteContact = (contact) => {
                updateCurrentEvent(e => {
                    const already = e.invitees.some(i => i.contactId === contact.id);
                    if (already) {
                        return { ...e, invitees: e.invitees.filter(i => i.contactId !== contact.id) };
                    }
                    const invitee = {
                        id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
                        contactId: contact.id, name: contact.name,
                        phone: contact.phone || '', email: contact.email || '',
                        status: 'pending', attended: null
                    };
                    return { ...e, invitees: [...e.invitees, invitee] };
                });
            };

            const setStatus = (inviteeId, status) => {
                updateCurrentEvent(e => ({
                    ...e,
                    invitees: e.invitees.map(i => i.id === inviteeId ? { ...i, status, attended: status === 'yes' ? i.attended : null } : i)
                }));
            };

            const setAttended = (inviteeId, attended) => {
                updateCurrentEvent(e => ({ ...e, invitees: e.invitees.map(i => i.id === inviteeId ? { ...i, attended } : i) }));
            };

            const startEditingMessage = () => {
                setMessageDraft(currentEvent.message || defaultMessage(currentEvent.title, currentEvent.date));
                setEditingMessage(true);
            };

            const saveMessage = () => {
                updateCurrentEvent(e => ({ ...e, message: messageDraft }));
                setEditingMessage(false);
            };

            const getMessage = (event) => event.message || defaultMessage(event.title, event.date);

            const smsLink = (invitee, event) => `sms:${invitee.phone}?body=${encodeURIComponent(getMessage(event))}`;
            const emailLink = (invitee, event) => `mailto:${invitee.email}?subject=${encodeURIComponent(event.title + ' - Invite')}&body=${encodeURIComponent(getMessage(event))}`;

            const textAllPending = () => {
                if (!currentEvent) return;
                const numbers = currentEvent.invitees.filter(i => i.status === 'pending' && i.phone).map(i => i.phone);
                if (!numbers.length) return;
                window.location.href = `sms:${numbers.join(',')}?body=${encodeURIComponent(getMessage(currentEvent))}`;
            };

            const emailAllPending = () => {
                if (!currentEvent) return;
                const emails = currentEvent.invitees.filter(i => i.status === 'pending' && i.email).map(i => i.email);
                if (!emails.length) return;
                window.location.href = `mailto:${emails.join(',')}?subject=${encodeURIComponent(currentEvent.title + ' - Invite')}&body=${encodeURIComponent(getMessage(currentEvent))}`;
            };

            const stats = currentEvent ? {
                yes: currentEvent.invitees.filter(i => i.status === 'yes').length,
                no: currentEvent.invitees.filter(i => i.status === 'no').length,
                pending: currentEvent.invitees.filter(i => i.status === 'pending').length,
                flaked: currentEvent.invitees.filter(i => i.status === 'yes' && i.attended === false).length,
            } : { yes: 0, no: 0, pending: 0, flaked: 0 };

            const statusBtnCls = (active, color) => `px-3 py-1.5 rounded-full text-xs font-semibold border transition-all ${active ? color : `${inputBgClass} ${subtextColorClass} border-transparent`}`;
            const tabBtnCls = (active) => `flex-1 py-2 rounded-lg text-sm font-semibold transition-all ${active ? 'bg-pink-600 text-white' : `${inputBgClass} ${subtextColorClass}`}`;

            const newRosterNames = logbookRoster.filter(name => !contacts.some(c => c.name.toLowerCase() === name.toLowerCase()));
            const isDark = theme === 'dark';
            const panelBg = isDark ? 'bg-gray-800 text-white' : 'bg-white text-gray-900';
            const sortedFilteredContacts = [...contacts]
                .filter(c => c.name.toLowerCase().includes(contactSearchQuery.trim().toLowerCase()))
                .sort((a, b) => {
                    if (contactSortMode === 'attendance') {
                        const diff = getContactStats(b.id).came - getContactStats(a.id).came;
                        if (diff !== 0) return diff;
                    }
                    return a.name.localeCompare(b.name);
                });

            return (
                <div className={`${mainCardBgClass} p-5 sm:p-6 rounded-2xl shadow-2xl w-[92vw] max-w-[1400px] flex flex-col transition-colors duration-500 relative`}>
                    <button
                        onClick={onBackToHome}
                        className="fixed z-30 px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white font-semibold rounded-lg shadow-md transition-all duration-200"
                        style={{ top: 'max(1rem, env(safe-area-inset-top))', left: 'max(1rem, env(safe-area-inset-left))' }}
                    >
                        &larr; Home
                    </button>

                    <h2 className={`text-3xl font-black text-center mb-6 mt-12 sm:mt-2 ${headingTextColorClass}`}>Invites</h2>

                    {!currentEvent ? (
                        <>
                            <div className="flex gap-2 mb-4">
                                <button onClick={() => setTab('events')} className={tabBtnCls(tab === 'events')}>Events</button>
                                <button onClick={() => setTab('contacts')} className={tabBtnCls(tab === 'contacts')}>Contacts</button>
                            </div>

                            {tab === 'events' ? (
                                <>
                                    <div className={`${sectionBgClass} rounded-xl p-4 mb-4`}>
                                        <h3 className={`text-sm font-bold mb-3 ${subtextColorClass}`}>Create New Event</h3>
                                        <input
                                            type="text"
                                            placeholder="Event title (e.g. Friday Night Cash Game)"
                                            value={newEventTitle}
                                            onChange={(e) => setNewEventTitle(e.target.value)}
                                            className={`${inputBgClass} ${inputBorderClass} border rounded-lg px-3 py-2 w-full mb-2 ${subtextColorClass}`}
                                        />
                                        <input
                                            type="date"
                                            value={newEventDate}
                                            onChange={(e) => setNewEventDate(e.target.value)}
                                            className={`${inputBgClass} ${inputBorderClass} border rounded-lg px-3 py-3 w-full mb-3 text-base ${subtextColorClass}`}
                                        />
                                        <button onClick={createEvent} className="w-full py-2 rounded-lg bg-pink-600 hover:bg-pink-700 text-white font-semibold">
                                            Create Event
                                        </button>
                                    </div>

                                    <h3 className={`text-sm font-bold mb-2 ${subtextColorClass}`}>Your Events</h3>
                                    {events.length === 0 && <p className={`text-sm italic ${placeholderColorClass}`}>No events yet — create one above.</p>}
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 max-h-[50vh] overflow-y-auto pr-1">
                                        {events.map(event => (
                                            <div key={event.id} className={`${sectionBgClass} rounded-lg p-3 flex items-center justify-between`}>
                                                <button onClick={() => setCurrentEventId(event.id)} className="text-left flex-grow min-w-0">
                                                    <div className={`font-semibold truncate ${subtextColorClass}`}>{event.title}</div>
                                                    <div className={`text-xs truncate ${placeholderColorClass}`}>{event.date || 'No date set'} &middot; {event.invitees.length} invited</div>
                                                </button>
                                                <button onClick={() => deleteEvent(event.id)} className="text-red-500 text-sm font-semibold px-3 py-2 -m-1 shrink-0">Delete</button>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            ) : (
                                <>
                                    <div className={`${sectionBgClass} rounded-xl p-4 mb-4`}>
                                        <h3 className={`text-sm font-bold mb-3 ${subtextColorClass}`}>Add Contact</h3>

                                        {contactPickerSupported && (
                                            <button
                                                onClick={importFromPhoneContacts}
                                                className="w-full py-3 mb-3 rounded-lg bg-teal-600 hover:bg-teal-700 text-white font-semibold"
                                            >
                                                📱 Import from Phone Contacts
                                            </button>
                                        )}

                                        <input
                                            type="file"
                                            id="vcf-import-input"
                                            accept=".vcf,text/vcard,text/x-vcard"
                                            className="hidden"
                                            onChange={handleVcfFileSelected}
                                        />
                                        <button
                                            onClick={() => document.getElementById('vcf-import-input').click()}
                                            className="w-full py-3 mb-2 rounded-lg bg-cyan-700 hover:bg-cyan-800 text-white font-semibold"
                                        >
                                            📇 Import Contacts File (.vcf)
                                        </button>
                                        <p className={`text-xs italic mb-4 ${placeholderColorClass}`}>
                                            {contactPickerSupported
                                                ? "This works with a .vcf file exported from any contacts app, on any device."
                                                : "On iPhone: open icloud.com/contacts in a browser, select the contacts you want, then Export vCard -- that downloads a .vcf file you can import here."}
                                        </p>

                                        {newRosterNames.length > 0 && (
                                            <div className="mb-3">
                                                <p className={`text-xs font-semibold mb-2 ${placeholderColorClass}`}>From your Logbook roster:</p>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {newRosterNames.map(name => (
                                                        <button
                                                            key={name}
                                                            onClick={() => quickAddContactFromRoster(name)}
                                                            className={`px-2.5 py-1 rounded-full text-xs font-medium ${inputBgClass} ${subtextColorClass} hover:opacity-80`}
                                                        >
                                                            + {name}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        <input
                                            type="text"
                                            placeholder="Name"
                                            value={newContactName}
                                            onChange={(e) => setNewContactName(e.target.value)}
                                            className={`${inputBgClass} ${inputBorderClass} border rounded-lg px-3 py-2 w-full mb-2 ${subtextColorClass}`}
                                        />
                                        <input
                                            type="tel"
                                            placeholder="Phone number (optional)"
                                            value={newContactPhone}
                                            onChange={(e) => setNewContactPhone(e.target.value)}
                                            className={`${inputBgClass} ${inputBorderClass} border rounded-lg px-3 py-2 w-full mb-2 ${subtextColorClass}`}
                                        />
                                        <input
                                            type="email"
                                            placeholder="Email address (optional)"
                                            value={newContactEmail}
                                            onChange={(e) => setNewContactEmail(e.target.value)}
                                            className={`${inputBgClass} ${inputBorderClass} border rounded-lg px-3 py-2 w-full mb-3 ${subtextColorClass}`}
                                        />
                                        <button onClick={addContact} className="w-full py-2 rounded-lg bg-pink-600 hover:bg-pink-700 text-white font-semibold">
                                            Add Contact
                                        </button>
                                    </div>

                                    <div className="flex items-center justify-between mb-2">
                                        <h3 className={`text-sm font-bold ${subtextColorClass}`}>Your Contacts</h3>
                                        <span className={`text-xs ${placeholderColorClass}`}>{contacts.length} total</span>
                                    </div>
                                    {contacts.length > 1 && (
                                        <div className="flex gap-2 mb-3">
                                            <button
                                                onClick={() => setContactSortMode('alpha')}
                                                className={`flex-1 py-1.5 rounded-lg text-xs font-semibold ${contactSortMode === 'alpha' ? 'bg-blue-600 text-white' : `${inputBgClass} ${subtextColorClass}`}`}
                                            >
                                                Sort: A–Z
                                            </button>

const tryDistributeForTarget = (targetStack, chipPlayers, chipDenominations) => {
  if (!targetStack || targetStack <= 0) return null;
  if (!chipPlayers || chipPlayers <= 0) return null;
  if (!chipDenominations || chipDenominations.length === 0) return null;

  const chipsSorted = [...chipDenominations]
    .filter(c => c.value > 0 && c.quantity > 0)
    .sort((a, b) => a.value - b.value); // small → big

  if (chipsSorted.length === 0) return null;

  const totalPlayers = chipPlayers;
  const perPlayerCapByChip = chipsSorted.map(chip =>
    Math.floor(chip.quantity / totalPlayers)
  );
  if (perPlayerCapByChip.every(cap => cap <= 0)) return null;

  const perPlayer = {};
  let remainingValue = targetStack;

  // Pass 1: prioritize smaller chips
  for (let i = 0; i < chipsSorted.length; i++) {
    const chip = chipsSorted[i];
    const capPerPlayer = perPlayerCapByChip[i];
    if (capPerPlayer <= 0) {
      perPlayer[chip.id] = 0;
      continue;
    }

    const idealCount = Math.floor(remainingValue / chip.value);
    const give = Math.max(0, Math.min(idealCount, capPerPlayer));
    perPlayer[chip.id] = give;
    remainingValue -= give * chip.value;
  }

  // Pass 2: use bigger chips to top off if still short
  for (let i = chipsSorted.length - 1; i >= 0 && remainingValue > 0; i--) {
    const chip = chipsSorted[i];
    const capPerPlayer = perPlayerCapByChip[i];
    const current = perPlayer[chip.id] || 0;
    const remainingCap = capPerPlayer - current;
    if (remainingCap <= 0) continue;

    const maxNeeded = Math.floor(remainingValue / chip.value);
    const add = Math.min(remainingCap, maxNeeded);
    if (add > 0) {
      perPlayer[chip.id] = current + add;
      remainingValue -= add * chip.value;
    }
  }

  if (remainingValue !== 0) return null; // require exact hit

  return { perPlayer, chipsSorted };
};

// Try to adjust a valid distribution to hit the ideal exactly,
// by removing and swapping chips, staying within 0..cap for each chip.
const rebalanceToIdeal = (ideal, distribution, chipPlayers, chipDenominations) => {
  if (!distribution) return null;

  const { perPlayer, chipsSorted } = distribution;

  // Recompute caps to enforce limits
  const totalPlayers = chipPlayers;
  const perPlayerCapByChip = chipsSorted.map(chip =>
    Math.floor(chip.quantity / totalPlayers)
  );

  // Current total per player
  let currentTotal = chipsSorted.reduce((sum, chip, idx) => {
    const cnt = perPlayer[chip.id] || 0;
    return sum + cnt * chip.value;
  }, 0);

  const diff = currentTotal - ideal;
  if (diff === 0) {
    // Already exact
    return { perPlayer, chipsSorted, effectiveStack: ideal, idealStack: ideal };
  }

  // Only handle the common case where we are ABOVE the ideal (e.g., 2,000 > 1,800)
  if (diff <= 0) return null;

  // Simple heuristic: try removing higher‑value chips and compensating
  // with smaller ones, constrained by caps.

  // Make a mutable copy
  const newPerPlayer = { ...perPlayer };
  let remainingOverage = diff;

  // Step A: try just removing high chips without adding small ones
  for (let i = chipsSorted.length - 1; i >= 0 && remainingOverage > 0; i--) {
    const chip = chipsSorted[i];
    const have = newPerPlayer[chip.id] || 0;
    if (have <= 0) continue;

    const maxRemovableValue = have * chip.value;
    const toRemove = Math.min(
      have,
      Math.floor(remainingOverage / chip.value)
    );
    if (toRemove > 0) {
      newPerPlayer[chip.id] = have - toRemove;
      remainingOverage -= toRemove * chip.value;
    }
  }

  if (remainingOverage === 0) {
    // We hit the ideal just by dropping some bigger chips.
    return {
      perPlayer: newPerPlayer,
      chipsSorted,
      effectiveStack: ideal,
      idealStack: ideal,
    };
  }

  // Step B (lightweight): if still above, try small compensation swaps:
  // for each big chip, see if we can remove 1 and add small chips whose total value
  // is slightly less, inching toward the ideal. This is a bounded local search,
  // not a full knapSack.

  // For safety, limit number of swap attempts
  const maxSwaps = 50;
  let swaps = 0;

  while (remainingOverage > 0 && swaps < maxSwaps) {
    let improved = false;

    for (let i = chipsSorted.length - 1; i >= 0 && remainingOverage > 0; i--) {
      const big = chipsSorted[i];
      const haveBig = newPerPlayer[big.id] || 0;
      if (haveBig <= 0) continue;

      // Try removing one big chip
      const removeValue = big.value;
      const targetDrop = Math.min(removeValue, remainingOverage);

      // Now add smaller chips up to (removeValue - targetDrop),
      // staying within caps.
      const smallNewPerPlayer = { ...newPerPlayer, [big.id]: haveBig - 1 };
      let smallAddedValue = 0;

      for (let j = 0; j < i; j++) {
        const small = chipsSorted[j];
        const cap = perPlayerCapByChip[j];
        const already = smallNewPerPlayer[small.id] || 0;
        const remainingCap = cap - already;
        if (remainingCap <= 0) continue;

        const maxWeCanAdd = Math.floor(
          (removeValue - targetDrop - smallAddedValue) / small.value
        );
        const toAdd = Math.min(remainingCap, maxWeCanAdd);
        if (toAdd > 0) {
          smallNewPerPlayer[small.id] = already + toAdd;
          smallAddedValue += toAdd * small.value;
        }
      }

      const netDrop = removeValue - smallAddedValue;
      if (netDrop > 0 && netDrop <= remainingOverage) {
        // Accept this swap
        Object.assign(newPerPlayer, smallNewPerPlayer);
        remainingOverage -= netDrop;
        swaps += 1;
        improved = true;
      }
    }

    if (!improved) break; // no better swap found
  }

  if (remainingOverage === 0) {
    return {
      perPlayer: newPerPlayer,
      chipsSorted,
      effectiveStack: ideal,
      idealStack: ideal,
    };
  }

  // Could not rebalance exactly
  return null;
};


const computePerPlayerChipDistribution = () => {
  const ideal =
    suggestedStack && typeof suggestedStack === 'object'
      ? suggestedStack.chips
      : suggestedStack;

  if (!ideal || ideal <= 0) return null;
  if (!chipPlayers || chipPlayers <= 0) return null;
  if (!chipDenominations || chipDenominations.length === 0) return null;

  const positiveValues = chipDenominations
    .map(c => c.value)
    .filter(v => v > 0);
  if (positiveValues.length === 0) return null;

  const step = Math.min(...positiveValues);

  const maxSpan = step * 400;

  let bestResult = null;
  let bestDiff = Infinity;

  for (let delta = 0; Math.abs(delta) <= maxSpan; ) {
    const target = ideal + delta;
    if (target > 0) {
      const result = tryDistributeForTarget(target, chipPlayers, chipDenominations);
      if (result) {
        const diff = Math.abs(target - ideal);
        if (diff < bestDiff) {
          bestDiff = diff;
          bestResult = {
            ...result,
            effectiveStack: target,
            idealStack: ideal,
          };
          if (diff === 0) break;
        }
      }
    }

    if (delta >= 0) {
      delta = -(delta + step);
    } else {
      delta = -delta;
    }
  }

  if (!bestResult) return null;

  // NEW: try to rebalance down to the ideal if we ended above it
  const rebalanced = rebalanceToIdeal(
    ideal,
    bestResult,
    chipPlayers,
    chipDenominations
  );

  return rebalanced || bestResult;
};

    setVisitedViews(prev => (prev.has(view) ? prev : new Set(prev).add(view)));
  };

  useEffect(() => {
    const unsubscribe = window.__firebaseAuth.onAuthStateChanged((user) => {
      window.__currentUser = user;
      setAuthUser(user);
    });
    return unsubscribe;
  }, []);

  useEffect(() => {
    const savedTheme = localStorage.getItem('pokerTimerTheme') || 'dark';
    setTheme(savedTheme);
  }, []);

  useEffect(() => {
    localStorage.setItem('pokerTimerTheme', theme);
    localStorage.setItem('pokerAppCurrentView', currentView);
  }, [theme, currentView]);

  useEffect(() => {
    document.documentElement.classList.remove('light', 'dark');
    document.documentElement.classList.add(theme);
  }, [theme]);

  const appBgClass = theme === 'dark' ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900';
  const mainCardBgClass = theme === 'dark' ? 'bg-gray-700' : 'bg-gray-100';
  const sectionBgClass = theme === 'dark' ? 'bg-gray-600' : 'bg-gray-200';
  const inputBgClass = theme === 'dark' ? 'bg-gray-700' : 'bg-gray-100';
  const inputBorderClass = theme === 'dark' ? 'border-gray-600' : 'border-gray-300';
  const subtextColorClass = theme === 'dark' ? 'text-gray-300' : 'text-gray-600';
  const placeholderColorClass = theme === 'dark' ? 'text-gray-400' : 'text-gray-500';
  const headingTextColorClass = theme === 'dark' ? 'text-yellow-400' : 'text-blue-700';

  const handleSelectMode = (mode) => {
    goToView(mode);
  };

  // If you still need this helper, keep it as a separate function
  const generateSmallTournament = (speed) => {
    if (!tempPlayersRange) return;
    const [minP, maxP] = tempPlayersRange;

    const highestChip = chipDenominations.length > 0
      ? Math.max(...chipDenominations.map(c => c.value))
      : 100;

    const maxBigBlind = highestChip * 10;

    let duration, stack, breakEvery;
    if (speed === 'turbo')       { duration = 8;  stack = 8000;  breakEvery = 6; }
    else if (speed === 'regular'){ duration = 12; stack = 15000; breakEvery = 5; }
    else                         { duration = 18; stack = 25000; breakEvery = 4; }

    const newLevels = [];
    let sb = highestChip;
    let bb = highestChip * 2;
    let ante = 0;
    let levelCount = 0;

    while (levelCount < 20 && bb <= maxBigBlind) {
      levelCount++;

      if (levelCount > 1 && (levelCount - 1) % breakEvery === 0) {
        newLevels.push({
          id: crypto.randomUUID(),
          sb: 0, bb: 0, ante: 0,
          duration: 15,
          isBreak: true,
          name: "Break"
        });
      }

      if (levelCount > 8)  ante = bb;
      if (levelCount > 14) ante = Math.round(bb * 1.5);

      newLevels.push({
        id: crypto.randomUUID(),
        sb,
        bb,
        ante: Math.round(ante),
        duration,
        isBreak: false
      });

      const multiplier = levelCount < 8 ? 2 : (levelCount < 14 ? 2.5 : 2);
      sb = Math.round(sb * multiplier / highestChip) * highestChip;
      bb = sb * 2;

      if (bb > maxBigBlind) break;
    }

    while (newLevels.length > 0 && newLevels[newLevels.length - 1].bb > maxBigBlind) {
      newLevels.pop();
    }

    setLevels(newLevels);
    setTempPlayersRange(null);
    alert(`Generated ${speed.toUpperCase()} tournament for ${minP}–${maxP} players!\n` +
          `Starting stack: ${stack.toLocaleString()}\n` +
          `Max blind: ${maxBigBlind.toLocaleString()} (10× highest chip)`);
  };

  return (
    <>
      <AuthWidget user={authUser} theme={theme} hidden={currentView === 'tracking'} />
      <div
        className={`zoom-scale-container min-h-screen flex flex-col items-center font-inter transition-colors duration-500 ${appBgClass} p-4 ${(currentView === 'invites' || currentView === 'tracking') ? 'hidden' : ''}`}
        style={{ zoom: uiScale, minHeight: '100dvh', justifyContent: 'safe center' }}
      >


      {/*
        All views are mounted at all times; only their visibility is toggled.
        This is what keeps the Tournament Clock and High Hand timers ticking,
        and the Tracking app's live session intact, while you're on a
        different tab -- switching away no longer unmounts (and destroys)
        the view you left.
      */}
      {/*
        Each view only mounts the first time you actually visit it (tracked via
        visitedViews) -- so nothing runs its startup code before you've ever
        opened it. Once visited, it stays mounted permanently (just hidden with
        CSS) so the Tournament Clock, High Hand timer, and Tracking app all keep
        running in the background while you're on a different tab.
      */}
      <div className={currentView === 'home' ? '' : 'hidden'}>
        <HomeView
          onSelectMode={handleSelectMode}
          theme={theme}
          headingTextColorClass={headingTextColorClass}
          mainCardBgClass={mainCardBgClass}
        />
      </div>

      {visitedViews.has('highHand') && (
        <div className={currentView === 'highHand' ? '' : 'hidden'}>
          <HighHandTimerView
            theme={theme}
            appBgClass={appBgClass}
            mainCardBgClass={mainCardBgClass}
            sectionBgClass={sectionBgClass}
            inputBgClass={inputBgClass}
            inputBorderClass={inputBorderClass}
            subtextColorClass={subtextColorClass}
            placeholderColorClass={placeholderColorClass}
            headingTextColorClass={headingTextColorClass}
            onBackToHome={() => goToView('home')}
            onThemeChange={setTheme}
            uiScale={uiScale}
            onZoomChange={setUiScale}
          />
        </div>
      )}

      {visitedViews.has('tournament') && (
        <div className={currentView === 'tournament' ? '' : 'hidden'}>
          <TournamentClockView
            theme={theme}
            appBgClass={appBgClass}
            mainCardBgClass={mainCardBgClass}
            sectionBgClass={sectionBgClass}
            inputBgClass={inputBgClass}
            inputBorderClass={inputBorderClass}
            subtextColorClass={subtextColorClass}
            placeholderColorClass={placeholderColorClass}
            headingTextColorClass={headingTextColorClass}
            onBackToHome={() => goToView('home')}
            onThemeChange={setTheme}
            uiScale={uiScale}
            onZoomChange={setUiScale}
          />
        </div>
      )}
      </div>

      {/*
        Invites, like Tracking below, lives OUTSIDE the zoomed container on
        purpose -- so the zoom slider (only meant for Tournament/High Hand)
        never shrinks or enlarges it. It gets its own matching centered
        wrapper so the layout still looks the same either way.
      */}
      {visitedViews.has('invites') && (
        <div
          className={`min-h-screen flex flex-col items-center font-inter transition-colors duration-500 ${appBgClass} p-4 ${currentView === 'invites' ? '' : 'hidden'}`}
          style={{ minHeight: '100dvh', justifyContent: 'safe center' }}
        >
          <InvitesView
            theme={theme}
            appBgClass={appBgClass}
            mainCardBgClass={mainCardBgClass}
            sectionBgClass={sectionBgClass}
            inputBgClass={inputBgClass}
            inputBorderClass={inputBorderClass}
            subtextColorClass={subtextColorClass}
            placeholderColorClass={placeholderColorClass}
            headingTextColorClass={headingTextColorClass}
            isActive={currentView === 'invites'}
            onBackToHome={() => goToView('home')}
          />
        </div>
      )}

      {/*
        TrackingView lives OUTSIDE the zoomed container on purpose -- CSS zoom
        scales everything inside it (fixed positioning included), so nesting
        the Logbook in there would shrink/enlarge its text and layout by
        whatever zoom level happens to be set. It's meant to render exactly
        like the standalone file, unaffected by the rest of the app's zoom.
      */}
      {visitedViews.has('tracking') && (
        <div className={currentView === 'tracking' ? '' : 'hidden'}>
          <TrackingView
            onBackToHome={() => goToView('home')}
          />
        </div>
      )}
    </>
  );
}


        // Mount the React app after the entire window has loaded
        window.onload = function() {
            console.log("window.onload triggered.");
            const container = document.getElementById('root');
            if (!container) {
                console.error("Root element with ID 'root' not found in the DOM.");
                document.body.innerHTML = `<div style="color: red; padding: 20px; font-family: sans-serif;">
                    <h3>Application Error</h3>
                    <p>The application could not start because the root element was not found.</p>
                    <p>Please ensure there is a &lt;div id="root"&gt;&lt;/div&gt; in your HTML body.</p>
                </div>`;
                return;
            }

            console.log("Root container found.");

            let attempts = 0;
            const maxAttempts = 50; // Try for up to 5 seconds (50 * 100ms)
            const intervalTime = 100; // Check every 100ms

            const tryMountApp = () => {
                // Check for both window.React and window.ReactDOM
                if (window.React && window.ReactDOM && typeof window.ReactDOM.createRoot === 'function') {
                    console.log(`React and ReactDOM are available after ${attempts} attempts. Attempting to mount.`);
                    try {
                        window.ReactDOM.createRoot(container).render(<App />);
                        console.log("React app mounted successfully.");
                    } catch (mountError) {
                        console.error("Error mounting React app:", mountError);
                        container.innerHTML = `<div style="color: red; padding: 20px; font-family: sans-serif;">
                            <h3>Application Error</h3>
                            <p>An error occurred while rendering the React app: ${mountError.message}</p>
                            <p>Please check the console for more details.</p>
                        </div>`;
                    }
                } else {
                    attempts++;
                    if (attempts < maxAttempts) {
                        console.log(`ReactDOM not yet available (attempt ${attempts}). Retrying in ${intervalTime}ms...`, {
                            reactGlobal: typeof window.React,
                            reactDOMGlobal: typeof window.ReactDOM,
                            createRootProp: typeof (window.ReactDOM ? window.ReactDOM.createRoot : 'N/A')
                        });
                        setTimeout(tryMountApp, intervalTime);
                    } else {
                        console.error("ReactDOM not fully loaded or createRoot not available after multiple attempts. Aborting.", {
                            reactGlobal: typeof window.React,
                            reactDOMGlobal: typeof window.ReactDOM,
                            createRootProp: typeof (window.ReactDOM ? window.ReactDOM.createRoot : 'N/A')
                        });
                        container.innerHTML = `<div style="color: red; padding: 20px; font-family: sans-serif;">
                            <h3>Application Error</h3>
                            <p>React libraries did not load correctly within the expected timeframe.</p>
                            <p>Please try refreshing the page or contact support if the issue persists.</p>
                        </div>`;
                    }
                }
            };

            // Wait until we know the auth state (and, if logged in, have pulled
            // any cloud-saved settings into localStorage) before mounting, so the
            // app's initial localStorage reads reflect the signed-in user's data.
            window.__authReadyPromise
                .then(() => tryMountApp())
                .catch(() => tryMountApp());
        };
    </script>
</body>
</html>
