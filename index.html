    <script type="text/babel">
        // Destructure useState, useEffect, useRef, useMemo from React global object
        const { useState, useEffect, useRef, useMemo, useLayoutEffect } = React;

        /**
         * AuthWidget Component
         * Small account button (top-right corner) plus a login/signup modal.
         * Handles email/password sign up, sign in, sign out, and password reset.
         */
        // Simple member list for site admins -- shows everyone who's signed up,
        // their tier, and when they joined, with a button to flip someone's tier
        // between Free and Pro. Firestore rules restrict both the read (listing
        // everyone) and the tier-change write to accounts flagged isAdmin.
        const AdminView = ({ onBackToHome }) => {
            const [members, setMembers] = useState(null);
            const [error, setError] = useState('');
            const [busyId, setBusyId] = useState(null);

            const loadMembers = async () => {
                setError('');
                try {
                    const snapshot = await window.__firebaseDb.collection('userSettings').get();
                    const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                    setMembers(list);
                } catch (e) {
                    console.error('Could not load members:', e);
                    setError("Couldn't load the member list -- check that the Firestore admin rules are published.");
                }
            };

            useEffect(() => { loadMembers(); }, []);

            const toggleTier = async (member) => {
                const newTier = member.tier === 'pro' ? 'free' : 'pro';
                setBusyId(member.id);
                try {
                    await window.__firebaseDb.collection('userSettings').doc(member.id).set({ tier: newTier }, { merge: true });
                    setMembers(prev => prev.map(m => m.id === member.id ? { ...m, tier: newTier } : m));
                } catch (e) {
                    console.error('Could not update tier:', e);
                    alert("Couldn't update that member's tier.");
                } finally {
                    setBusyId(null);
                }
            };

            const grantTrial = async (member) => {
                const trialEnd = Date.now() + 7 * 24 * 60 * 60 * 1000;
                setBusyId(member.id);
                try {
                    await window.__firebaseDb.collection('userSettings').doc(member.id).set({ trialEndsAt: trialEnd, trialUsed: true }, { merge: true });
                    setMembers(prev => prev.map(m => m.id === member.id ? { ...m, trialEndsAt: trialEnd, trialUsed: true } : m));
                } catch (e) {
                    console.error('Could not grant trial:', e);
                    alert("Couldn't start a trial for that member.");
                } finally {
                    setBusyId(null);
                }
            };

            const proCount = members ? members.filter(m => m.tier === 'pro').length : 0;
            const freeCount = members ? members.filter(m => m.tier !== 'pro').length : 0;

            return (
                <div className="min-h-screen flex flex-col items-center bg-gray-900 text-white p-4" style={{ minHeight: '100dvh' }}>
                    <button
                        onClick={onBackToHome}
                        className="fixed z-30 px-4 py-2 bg-gray-500 hover:bg-gray-600 text-white font-semibold rounded-lg shadow-md transition-all duration-200"
                        style={{ top: 'max(0.75rem, env(safe-area-inset-top))', left: 'max(0.75rem, env(safe-area-inset-left))' }}
                    >
                        &larr; Home
                    </button>
                    <div className="bg-gray-800 p-5 sm:p-6 rounded-2xl shadow-2xl w-[92vw] max-w-[900px] mt-16 mb-8" style={{ margin: 'auto' }}>
                        <h2 className="text-3xl font-black text-center mb-1 text-blue-400">Admin Dashboard</h2>
                        <p className="text-center text-sm text-gray-400 mb-6">{members ? `${members.length} member(s) · ${proCount} Pro · ${freeCount} Free` : 'Loading…'}</p>

                        {error && <p className="text-red-400 text-sm text-center mb-4">{error}</p>}

                        {members && members.length === 0 && !error && (
                            <p className="text-center text-gray-400 text-sm">No members found yet.</p>
                        )}

                        {members && members.length > 0 && (
                            <div className="space-y-2">
                                {members.map(member => {
                                    const onTrial = member.trialEndsAt && member.trialEndsAt > Date.now();
                                    const trialDaysLeft = onTrial ? Math.max(1, Math.ceil((member.trialEndsAt - Date.now()) / (24 * 60 * 60 * 1000))) : 0;
                                    return (
                                    <div key={member.id} className="bg-gray-700 rounded-lg p-3 flex items-center justify-between gap-3">
                                        <div className="min-w-0">
                                            <div className="font-semibold truncate flex items-center gap-2">
                                                {member.email || member.id}
                                                {member.isAdmin && <span className="text-[10px] font-bold uppercase bg-purple-600 px-2 py-0.5 rounded-full">Admin</span>}
                                                {onTrial && <span className="text-[10px] font-bold uppercase bg-blue-500/30 border border-blue-400/50 px-2 py-0.5 rounded-full">Trial · {trialDaysLeft}d left</span>}
                                            </div>
                                            <div className="text-xs text-gray-400">
                                                Joined {member.createdAt ? new Date(member.createdAt).toLocaleDateString() : 'Unknown'}
                                                {member.updatedAt && <> · Last synced {new Date(member.updatedAt).toLocaleDateString()}</>}
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 shrink-0">
                                            <span className={`text-xs font-bold uppercase px-2 py-1 rounded-full ${member.tier === 'pro' ? 'bg-blue-600' : 'bg-gray-600'}`}>
                                                {member.tier === 'pro' ? 'Pro' : 'Free'}
                                            </span>
                                            {member.tier !== 'pro' && !onTrial && (
                                                <button
                                                    onClick={() => grantTrial(member)}
                                                    disabled={busyId === member.id}
                                                    className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-gray-600 hover:bg-gray-500 disabled:opacity-50"
                                                >
                                                    {busyId === member.id ? '…' : (member.trialUsed ? 'Restart Trial' : 'Grant Trial')}
                                                </button>
                                            )}
                                            <button
                                                onClick={() => toggleTier(member)}
                                                disabled={busyId === member.id}
                                                className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-700 disabled:opacity-50"
                                            >
                                                {busyId === member.id ? '…' : `Make ${member.tier === 'pro' ? 'Free' : 'Pro'}`}
                                            </button>
                                        </div>
                                    </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const AuthWidget = ({ user, theme, hidden, isAdmin, onGoToAdmin, userTier, trialEndsAt, trialUsed, onStartTrial }) => {
            const [open, setOpen] = useState(false);
            const [mode, setMode] = useState('login'); // 'login' | 'signup'
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [busy, setBusy] = useState(false);
            const [info, setInfo] = useState('');
            const [showPrivacyPolicy, setShowPrivacyPolicy] = useState(false);
            const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
            const [deletePassword, setDeletePassword] = useState('');
            const [deleteError, setDeleteError] = useState('');
            const [deleteBusy, setDeleteBusy] = useState(false);

            const isDark = theme === 'dark';
            const panelBg = isDark ? 'bg-gray-800 text-white' : 'bg-white text-gray-900';
            const inputCls = `w-full px-3 py-2 rounded-md border mb-3 ${isDark ? 'bg-gray-700 border-gray-600 text-white' : 'bg-gray-50 border-gray-300 text-gray-900'}`;

            const resetFormState = () => { setError(''); setInfo(''); setPassword(''); };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(''); setInfo(''); setBusy(true);
                try {
                    if (mode === 'signup') {
                        await window.__firebaseAuth.createUserWithEmailAndPassword(email, password);
                    } else {
                        await window.__firebaseAuth.signInWithEmailAndPassword(email, password);
                    }
                    setOpen(false);
                    resetFormState();
                } catch (err) {
                    setError(err.message.replace('Firebase: ', ''));
                } finally {
                    setBusy(false);
                }
            };

            const handleForgotPassword = async () => {
                if (!email) { setError('Enter your email above first, then tap "Forgot password".'); return; }
                setError(''); setBusy(true);
                try {
                    await window.__firebaseAuth.sendPasswordResetEmail(email);
                    setInfo('Password reset email sent — check your inbox.');
                } catch (err) {
                    setError(err.message.replace('Firebase: ', ''));
                } finally {
                    setBusy(false);
                }
            };

            const handleLogout = async () => {
                await window.__firebaseAuth.signOut();
                setOpen(false);
            };

            // Permanently deletes the account and everything tied to it: the
            // Firestore document (settings, contacts, invites, roster sync data),
            // any hosted calendar files in Storage, the Auth account itself, and
            // this device's local copy of everything. Requires re-entering the
            // password first, both as a safety confirmation and because Firebase
            // requires a "recent" login before allowing account deletion.
            const handleDeleteAccount = async () => {
                if (!deletePassword) { setDeleteError('Enter your password to confirm.'); return; }
                setDeleteError('');
                setDeleteBusy(true);
                try {
                    const credential = firebase.auth.EmailAuthProvider.credential(user.email, deletePassword);
                    await user.reauthenticateWithCredential(credential);

                    const uid = user.uid;

                    try { await window.__firebaseDb.collection('userSettings').doc(uid).delete(); }
                    catch (e) { console.error('Could not delete Firestore data:', e); }

                    try {
                        const listRef = window.__firebaseStorage.ref(`icsFiles/${uid}`);
                        const list = await listRef.listAll();
                        await Promise.all(list.items.map(item => item.delete()));
                    } catch (e) { console.error('Could not delete stored calendar files:', e); }

                    await user.delete();

                    localStorage.clear();
                    setOpen(false);
                    window.location.reload();
                } catch (err) {
                    setDeleteError(err.message.replace('Firebase: ', ''));
                } finally {
                    setDeleteBusy(false);
                }
            };

            return (
                <>
                    {!hidden && (
                    <div className="fixed z-40" style={{ top: 'max(0.75rem, env(safe-area-inset-top))', right: 'max(0.75rem, env(safe-area-inset-right))' }}>
                        {user ? (
                            <button
                                onClick={() => setOpen(true)}
                                className={`max-w-[42vw] sm:max-w-none truncate px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium shadow ${isDark ? 'bg-gray-700 text-white' : 'bg-white text-gray-800'} border ${isDark ? 'border-gray-600' : 'border-gray-300'}`}
                            >
                                {user.email}
                            </button>
                        ) : (
                            <button
                                onClick={() => { setOpen(true); setMode('login'); resetFormState(); }}
                                className="px-3 py-1.5 rounded-full text-xs sm:text-sm font-medium shadow bg-yellow-500 text-gray-900 hover:bg-yellow-400 whitespace-nowrap"
                            >
                                Log In / Sign Up
                            </button>
                        )}
                    </div>
                    )}

                    {open && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
                            <div className={`w-full max-w-sm rounded-xl shadow-2xl p-6 ${panelBg}`}>
                                {user ? (
                                    <>
                                        <h2 className="text-lg font-bold mb-2">Account</h2>
                                        <p className="text-sm mb-4 opacity-80">Signed in as {user.email}</p>
                                        <p className="text-xs mb-4 opacity-60">Your settings sync automatically to your account and follow you to any device you log into. All of it is encrypted in transit and at rest, and only visible to you.</p>

                                        {userTier !== 'pro' && trialEndsAt && trialEndsAt > Date.now() && (
                                            <p className="text-xs text-center mb-3 px-3 py-2 rounded-md bg-blue-600/20 border border-blue-500/40">
                                                ⏳ Pro trial active — {Math.max(1, Math.ceil((trialEndsAt - Date.now()) / (24 * 60 * 60 * 1000)))} day(s) left
                                            </p>
                                        )}
                                        {userTier !== 'pro' && !trialUsed && (
                                            <button onClick={onStartTrial} className="w-full py-2 rounded-md bg-blue-600 hover:bg-blue-700 text-white font-medium mb-2">
                                                ⭐ Start 7-Day Free Pro Trial
                                            </button>
                                        )}
                                        {userTier !== 'pro' && trialUsed && !(trialEndsAt && trialEndsAt > Date.now()) && (
                                            <p className="text-xs text-center mb-3 opacity-60">Your free Pro trial has ended.</p>
                                        )}

                                        {isAdmin && (
                                            <button onClick={() => { setOpen(false); onGoToAdmin(); }} className="w-full py-2 rounded-md bg-purple-600 hover:bg-purple-700 text-white font-medium mb-2">
                                                🛠️ Admin Dashboard
                                            </button>
                                        )}
                                        <button onClick={handleLogout} className="w-full py-2 rounded-md bg-red-600 text-white font-medium mb-2">
                                            Log Out
                                        </button>
                                        <button onClick={() => setShowPrivacyPolicy(true)} className="w-full text-xs underline opacity-70 mb-3">
                                            Privacy Policy
                                        </button>

                                        {!showDeleteConfirm ? (
                                            <button onClick={() => setShowDeleteConfirm(true)} className="w-full py-2 rounded-md border border-red-600 text-red-500 text-sm font-medium mb-2">
                                                Delete My Account &amp; Data
                                            </button>
                                        ) : (
                                            <div className="mb-2 p-3 rounded-md border border-red-600/50 bg-red-500/5">
                                                <p className="text-xs text-red-400 mb-2 font-semibold">
                                                    This permanently deletes your account, contacts, invites, roster sync, and any hosted calendar files. This cannot be undone.
                                                </p>
                                                <input
                                                    type="password"
                                                    placeholder="Confirm your password"
                                                    value={deletePassword}
                                                    onChange={(e) => setDeletePassword(e.target.value)}
                                                    className={inputCls}
                                                />

                                                <div className="flex gap-2">
                                                    <button onClick={handleDeleteAccount} disabled={deleteBusy} className="flex-1 py-2 rounded-md bg-red-600 text-white text-sm font-semibold disabled:opacity-50">
                                                        {deleteBusy ? 'Deleting…' : 'Permanently Delete'}
                                                    </button>
                                                    <button
                                                        onClick={() => { setShowDeleteConfirm(false); setDeletePassword(''); setDeleteError(''); }}
                                                        className="flex-1 py-2 rounded-md border text-sm"
                                                    >
                                                        Cancel
                                                    </button>
                                                </div>
                                            </div>

                                        <button onClick={() => setOpen(false)} className="w-full py-2 rounded-md border">

                                ) : (
                                    <>
                                        <h2 className="text-lg font-bold mb-4">{mode === 'login' ? 'Log In' : 'Create Account'}</h2>
                                        <form onSubmit={handleSubmit}>
                                            <input
                                                type="email"
                                                placeholder="Email"
                                                value={email}
                                                onChange={(e) => setEmail(e.target.value)}
                                                className={inputCls}
                                                required
                                            />
                                            <input
                                                type="password"
                                                placeholder="Password"
                                                value={password}
                                                onChange={(e) => setPassword(e.target.value)}
                                                className={inputCls}
                                                required
                                                minLength={6}
                                            />
                                            {error && <p className="text-red-500 text-sm mb-3">{error}</p>}
                                            {info && <p className="text-green-500 text-sm mb-3">{info}</p>}
                                            <button
                                                type="submit"
                                                disabled={busy}
                                                className="w-full py-2 rounded-md bg-yellow-500 text-gray-900 font-semibold mb-2 disabled:opacity-50"
                                            >
                                                {busy ? 'Please wait…' : (mode === 'login' ? 'Log In' : 'Sign Up')}
                                            </button>

                    {showPrivacyPolicy && (

                                    <p><strong>What we don't do.</strong> We don't sell data, share it with advertisers, or use it for anything beyond running the app's features for you.</p>

                                </div>
