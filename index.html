                                        </ul>
                                    )}
                                </div>

                            </div>
                        </div>
                    )}

                    {/* Bad Beat Jackpot Hand Selector Modal */}
                    {showBadBeatHandSelector && (
                        <div className={`fixed inset-0 ${theme === 'dark' ? 'bg-gray-900 bg-opacity-75' : 'bg-gray-200 bg-opacity-75'} flex items-center justify-center z-50 transition-colors duration-500`}>
                            <div className={`${mainCardBgClass} p-5 rounded-2xl shadow-2xl w-full max-w-2xl overflow-y-auto max-h-[90vh] transition-colors duration-500`}>
                                <h2 className={`text-3xl font-bold text-center mb-6 ${headingTextColorClass}`}>Select Bad Beat Qualification Hand</h2>

                                {/* Current Hand Selection for Bad Beat */}
                                <div className={`mb-6 p-4 rounded-lg border ${inputBorderClass} ${sectionBgClass}`}>
                                    <h3 className={`text-xl font-semibold mb-3 ${headingTextColorClass}`}>Currently Building:</h3>
                                    <div className="flex flex-wrap justify-center items-center gap-2 mb-4 min-h-[60px]">
                                        {tempBadBeatSelection.length > 0 ? (
                                            tempBadBeatSelection.map((card, index) => (
                                                <div key={index} className="relative">
                                                    <CardDisplay cardString={card} isLarge={false} />
                                                    <button
                                                        onClick={() => handleRemoveCard(card, setTempBadBeatSelection)}
                                                        className="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold"
                                                    >
                                                        X
                                                    </button>
                                                </div>
                                            ))
                                        ) : (
                                            <p className={`${placeholderColorClass}`}>Select 5 cards below to build the qualification hand.</p>
                                        )}
                                    </div>

                                    {/* Card Selection Grid for Bad Beat Hand */}
                                    {tempBadBeatSelection.length < 5 && (
                                        <div className="mb-4">
                                            <p className={`${subtextColorClass} text-sm mb-3 text-center`}>Tap a card to add it:</p>
                                            <div className="space-y-1.5">
                                                {suits.map(suit => (
                                                    <div key={suit} className="flex gap-1.5 justify-center flex-wrap">
                                                        {ranks.map(rank => {
                                                            const cardCode = rank + suit;
                                                            const isUsed = tempBadBeatSelection.includes(cardCode);
                                                            const isDisabled = isUsed || tempBadBeatSelection.length >= 5;
                                                            return (
                                                                <button
                                                                    key={cardCode}
                                                                    onClick={() => {
                                                                        if (!isDisabled) setTempBadBeatSelection(prev => [...prev, cardCode]);
                                                                    }}
                                                                    disabled={isDisabled}
                                                                    className={`w-9 h-12 sm:w-10 sm:h-14 rounded-md border-2 flex flex-col items-center justify-center font-bold bg-white transition-all
                                                                        ${isDisabled ? 'opacity-25 cursor-not-allowed border-gray-300' : 'border-gray-300 hover:border-blue-500 hover:scale-110 hover:shadow-lg cursor-pointer'}
                                                                    `}
                                                                >
                                                                    <span className={`text-xs sm:text-sm leading-none ${suitDisplayInfo[suit].color}`}>{rank}</span>
                                                                    <span className={`text-sm sm:text-base leading-none ${suitDisplayInfo[suit].color}`}>{suitDisplayInfo[suit].symbol}</span>
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="mt-4 flex justify-center space-x-4">
                                        <button onClick={handleConfirmBadBeatHand} disabled={tempBadBeatSelection.length !== 5} className="px-5 py-2 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                                            Confirm Hand
                                        </button>
                                        <button onClick={() => {
                                            handleClearSelectionAndStates(setTempBadBeatSelection, setBadBeatSelectedRank, setBadBeatSelectedSuit);
                                            setShowBadBeatHandSelector(false);
                                        }} className="px-5 py-2 bg-gray-500 hover:bg-gray-600 text-white font-semibold rounded-lg shadow-md">
                                            Cancel
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                    <audio ref={audioRef} src="https://quicksounds.com/uploads/tracks/1098360932_1903340572_1377612226.mp3" preload="auto"></audio>
                </div>
            );
        };

        /**
         * Main App Component
         * Manages the overall application view state (home, highHand, tournament)
         * and common settings like theme.
         */
        function App() {
  console.log("App component rendering");
  const [currentView, setCurrentView] = useState(() => localStorage.getItem('pokerAppCurrentView') || 'home');
  const [visitedViews, setVisitedViews] = useState(() => new Set([localStorage.getItem('pokerAppCurrentView') || 'home']));
  const [uiScale, setUiScale] = useState(() => parseFloat(localStorage.getItem('uiScale')) || 1);

  useEffect(() => {
    localStorage.setItem('uiScale', uiScale.toString());
  }, [uiScale]);
  const [theme, setTheme] = useState('dark');
  const [authUser, setAuthUser] = useState(() => window.__currentUser);
  const [userTier, setUserTier] = useState(() => window.__userTier);
  const [isAdmin, setIsAdmin] = useState(() => window.__isAdmin);
  const [trialEndsAt, setTrialEndsAt] = useState(() => window.__trialEndsAt);
  const [trialUsed, setTrialUsed] = useState(() => window.__trialUsed);
  const isEffectivePro = userTier === 'pro' || (trialEndsAt && trialEndsAt > Date.now());

  const goToView = (view) => {
    setCurrentView(view);
    setVisitedViews(prev => (prev.has(view) ? prev : new Set(prev).add(view)));
  };

  useEffect(() => {
    const unsubscribe = window.__firebaseAuth.onAuthStateChanged(async (user) => {
      window.__currentUser = user;
      setAuthUser(user);
      if (user) {
        await window.__resolveUserTier(user);
        setUserTier(window.__userTier);
        setIsAdmin(window.__isAdmin);
        setTrialEndsAt(window.__trialEndsAt);
        setTrialUsed(window.__trialUsed);
      } else {
        setUserTier(null);
        setIsAdmin(false);
        setTrialEndsAt(null);
        setTrialUsed(false);
      }
    });
    return unsubscribe;
  }, []);

  // Starts a 7-day Pro trial for the current user. Guards against repeat use
  // client-side (the Firestore rules do too -- see the trial section of the
  // rules), and immediately updates local state so the UI reflects it without
  // waiting for a full re-auth cycle.
  const startTrial = async () => {
    if (!authUser || trialUsed || userTier === 'pro') return;
    const trialEnd = Date.now() + 7 * 24 * 60 * 60 * 1000;
    try {
      await window.__firebaseDb.collection('userSettings').doc(authUser.uid).set({
        trialEndsAt: trialEnd,
        trialUsed: true,
      }, { merge: true });
      window.__trialEndsAt = trialEnd;
      window.__trialUsed = true;
      setTrialEndsAt(trialEnd);
      setTrialUsed(true);
    } catch (e) {
      console.error('Could not start trial:', e);
      alert("Couldn't start your trial -- please try again in a moment.");
    }
  };

  useEffect(() => {
    const savedTheme = localStorage.getItem('pokerTimerTheme') || 'dark';
    setTheme(savedTheme);
  }, []);

  useEffect(() => {
    localStorage.setItem('pokerTimerTheme', theme);
    localStorage.setItem('pokerAppCurrentView', currentView);
  }, [theme, currentView]);

  useEffect(() => {
    document.documentElement.classList.remove('light', 'dark');
    document.documentElement.classList.add(theme);
  }, [theme]);

  const appBgClass = theme === 'dark' ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-900';
  const mainCardBgClass = theme === 'dark' ? 'bg-gray-700' : 'bg-gray-100';
  const sectionBgClass = theme === 'dark' ? 'bg-gray-600' : 'bg-gray-200';
  const inputBgClass = theme === 'dark' ? 'bg-gray-700' : 'bg-gray-100';
  const inputBorderClass = theme === 'dark' ? 'border-gray-600' : 'border-gray-300';
  const subtextColorClass = theme === 'dark' ? 'text-gray-300' : 'text-gray-600';
  const placeholderColorClass = theme === 'dark' ? 'text-gray-400' : 'text-gray-500';
  const headingTextColorClass = theme === 'dark' ? 'text-yellow-400' : 'text-blue-700';

  const handleSelectMode = (mode) => {
    goToView(mode);
  };

  // If you still need this helper, keep it as a separate function
  const generateSmallTournament = (speed) => {
    if (!tempPlayersRange) return;
    const [minP, maxP] = tempPlayersRange;

    const highestChip = chipDenominations.length > 0
      ? Math.max(...chipDenominations.map(c => c.value))
      : 100;

    const maxBigBlind = highestChip * 10;

    let duration, stack, breakEvery;
    if (speed === 'turbo')       { duration = 8;  stack = 8000;  breakEvery = 6; }
    else if (speed === 'regular'){ duration = 12; stack = 15000; breakEvery = 5; }
    else                         { duration = 18; stack = 25000; breakEvery = 4; }

    const newLevels = [];
    let sb = highestChip;
    let bb = highestChip * 2;
    let ante = 0;
    let levelCount = 0;

    while (levelCount < 20 && bb <= maxBigBlind) {
      levelCount++;

      if (levelCount > 1 && (levelCount - 1) % breakEvery === 0) {
        newLevels.push({
          id: crypto.randomUUID(),
          sb: 0, bb: 0, ante: 0,
          duration: 15,
          isBreak: true,
          name: "Break"
        });
      }

      if (levelCount > 8)  ante = bb;
      if (levelCount > 14) ante = Math.round(bb * 1.5);

      newLevels.push({
        id: crypto.randomUUID(),
        sb,
        bb,
        ante: Math.round(ante),
        duration,
        isBreak: false
      });

      const multiplier = levelCount < 8 ? 2 : (levelCount < 14 ? 2.5 : 2);
      sb = Math.round(sb * multiplier / highestChip) * highestChip;
      bb = sb * 2;

      if (bb > maxBigBlind) break;
    }

    while (newLevels.length > 0 && newLevels[newLevels.length - 1].bb > maxBigBlind) {
      newLevels.pop();
    }

    setLevels(newLevels);
    setTempPlayersRange(null);
    alert(`Generated ${speed.toUpperCase()} tournament for ${minP}–${maxP} players!\n` +
          `Starting stack: ${stack.toLocaleString()}\n` +
          `Max blind: ${maxBigBlind.toLocaleString()} (10× highest chip)`);
  };

  return (
    <>
      <AuthWidget
        user={authUser}
        theme={theme}
        hidden={currentView === 'tracking'}
        isAdmin={isAdmin}
        onGoToAdmin={() => goToView('admin')}
        userTier={userTier}
        trialEndsAt={trialEndsAt}
        trialUsed={trialUsed}
        onStartTrial={startTrial}
      />
      <div
        className={`zoom-scale-container min-h-screen flex flex-col items-center font-inter transition-colors duration-500 ${appBgClass} p-4`}
        style={{
          zoom: uiScale,
          minHeight: '100dvh',
          display: (currentView === 'invites' || currentView === 'tracking' || currentView === 'admin') ? 'none' : 'flex'
        }}
      >

      {/*
        All views are mounted at all times; only their visibility is toggled.
        This is what keeps the Tournament Clock and High Hand timers ticking,
        and the Tracking app's live session intact, while you're on a
        different tab -- switching away no longer unmounts (and destroys)
        the view you left.
      */}
      {/*
        Each view only mounts the first time you actually visit it (tracked via
        visitedViews) -- so nothing runs its startup code before you've ever
        opened it. Once visited, it stays mounted permanently (just hidden with
        CSS) so the Tournament Clock, High Hand timer, and Tracking app all keep
        running in the background while you're on a different tab.
      */}
      <div className={currentView === 'home' ? '' : 'hidden'} style={{ margin: 'auto' }}>
        <HomeView
          onSelectMode={handleSelectMode}
          theme={theme}
          headingTextColorClass={headingTextColorClass}
          mainCardBgClass={mainCardBgClass}
        />
      </div>

      {visitedViews.has('highHand') && (
        <div className={currentView === 'highHand' ? '' : 'hidden'} style={{ margin: 'auto' }}>
          <HighHandTimerView
            theme={theme}
            appBgClass={appBgClass}
            mainCardBgClass={mainCardBgClass}
            sectionBgClass={sectionBgClass}
            inputBgClass={inputBgClass}
            inputBorderClass={inputBorderClass}
            subtextColorClass={subtextColorClass}
            placeholderColorClass={placeholderColorClass}
            headingTextColorClass={headingTextColorClass}
            onBackToHome={() => goToView('home')}
            onThemeChange={setTheme}
            uiScale={uiScale}
            onZoomChange={setUiScale}
          />
        </div>
      )}

      {visitedViews.has('tournament') && (
        <div className={currentView === 'tournament' ? '' : 'hidden'} style={{ margin: 'auto' }}>
          <TournamentClockView
            theme={theme}
            appBgClass={appBgClass}
            mainCardBgClass={mainCardBgClass}
            sectionBgClass={sectionBgClass}
            inputBgClass={inputBgClass}
            inputBorderClass={inputBorderClass}
            subtextColorClass={subtextColorClass}
            placeholderColorClass={placeholderColorClass}
            headingTextColorClass={headingTextColorClass}
            onBackToHome={() => goToView('home')}
            onThemeChange={setTheme}
            uiScale={uiScale}
            onZoomChange={setUiScale}
          />
        </div>
      )}
      </div>

      {/*
        Invites, like Tracking below, lives OUTSIDE the zoomed container on
        purpose -- so the zoom slider (only meant for Tournament/High Hand)
        never shrinks or enlarges it. It gets its own matching centered
        wrapper so the layout still looks the same either way.
      */}
      {visitedViews.has('invites') && (
        <div
          className={`min-h-screen flex flex-col items-center font-inter transition-colors duration-500 ${appBgClass} p-4 ${currentView === 'invites' ? '' : 'hidden'}`}
          style={{ minHeight: '100dvh' }}
        >
          <InvitesView
            theme={theme}
            appBgClass={appBgClass}
            mainCardBgClass={mainCardBgClass}
            sectionBgClass={sectionBgClass}
            inputBgClass={inputBgClass}
            inputBorderClass={inputBorderClass}
            subtextColorClass={subtextColorClass}
            placeholderColorClass={placeholderColorClass}
            headingTextColorClass={headingTextColorClass}
            isActive={currentView === 'invites'}
            onBackToHome={() => goToView('home')}
          />
        </div>
      )}

      {visitedViews.has('admin') && (
        <div className={currentView === 'admin' ? '' : 'hidden'}>
          {isAdmin ? (
            <AdminView onBackToHome={() => goToView('home')} />
          ) : (
            <div className="min-h-screen flex flex-col items-center justify-center bg-gray-900 text-white p-4">
              <p className="mb-4">You don't have access to this page.</p>
              <button onClick={() => goToView('home')} className="px-6 py-3 bg-gray-600 hover:bg-gray-700 rounded-lg font-semibold">
                &larr; Home
              </button>
            </div>
          )}
        </div>
      )}

      {/*
        TrackingView lives OUTSIDE the zoomed container on purpose -- CSS zoom
        scales everything inside it (fixed positioning included), so nesting
        the Logbook in there would shrink/enlarge its text and layout by
        whatever zoom level happens to be set. It's meant to render exactly
        like the standalone file, unaffected by the rest of the app's zoom.
      */}
      {visitedViews.has('tracking') && (
        <div style={{ display: currentView === 'tracking' ? 'block' : 'none' }}>
          <TrackingView
            onBackToHome={() => goToView('home')}
          />
        </div>
      )}
    </>
  );
}


        // Mount the React app after the entire window has loaded
        window.onload = function() {
            console.log("window.onload triggered.");
            const container = document.getElementById('root');
            if (!container) {
                console.error("Root element with ID 'root' not found in the DOM.");
                document.body.innerHTML = `<div style="color: red; padding: 20px; font-family: sans-serif;">
                    <h3>Application Error</h3>
                    <p>The application could not start because the root element was not found.</p>
                    <p>Please ensure there is a &lt;div id="root"&gt;&lt;/div&gt; in your HTML body.</p>
                </div>`;
                return;
            }

            console.log("Root container found.");

            let attempts = 0;
            const maxAttempts = 50; // Try for up to 5 seconds (50 * 100ms)
            const intervalTime = 100; // Check every 100ms

            const tryMountApp = () => {
                // Check for both window.React and window.ReactDOM
                if (window.React && window.ReactDOM && typeof window.ReactDOM.createRoot === 'function') {
                    console.log(`React and ReactDOM are available after ${attempts} attempts. Attempting to mount.`);
                    try {
                        window.ReactDOM.createRoot(container).render(<App />);
                        console.log("React app mounted successfully.");
                    } catch (mountError) {
                        console.error("Error mounting React app:", mountError);
                        container.innerHTML = `<div style="color: red; padding: 20px; font-family: sans-serif;">
                            <h3>Application Error</h3>
                            <p>An error occurred while rendering the React app: ${mountError.message}</p>
                            <p>Please check the console for more details.</p>
                        </div>`;
                    }
                } else {
                    attempts++;
                    if (attempts < maxAttempts) {
                        console.log(`ReactDOM not yet available (attempt ${attempts}). Retrying in ${intervalTime}ms...`, {
                            reactGlobal: typeof window.React,
                            reactDOMGlobal: typeof window.ReactDOM,
                            createRootProp: typeof (window.ReactDOM ? window.ReactDOM.createRoot : 'N/A')
                        });
                        setTimeout(tryMountApp, intervalTime);
                    } else {
                        console.error("ReactDOM not fully loaded or createRoot not available after multiple attempts. Aborting.", {
                            reactGlobal: typeof window.React,
                            reactDOMGlobal: typeof window.ReactDOM,
                            createRootProp: typeof (window.ReactDOM ? window.ReactDOM.createRoot : 'N/A')
                        });
                        container.innerHTML = `<div style="color: red; padding: 20px; font-family: sans-serif;">
                            <h3>Application Error</h3>
                            <p>React libraries did not load correctly within the expected timeframe.</p>
                            <p>Please try refreshing the page or contact support if the issue persists.</p>
                        </div>`;
                    }
                }
            };

            // Wait until we know the auth state (and, if logged in, have pulled
            // any cloud-saved settings into localStorage) before mounting, so the
            // app's initial localStorage reads reflect the signed-in user's data.
            window.__authReadyPromise
                .then(() => tryMountApp())
                .catch(() => tryMountApp());
        };
    </script>
</body>
